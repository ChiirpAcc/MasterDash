<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHIIRP sales</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230F141B%22/><rect x=%227%22 y=%2216%22 width=%224%22 height=%229%22 rx=%221%22 fill=%22%237AA7FF%22/><rect x=%2214%22 y=%2210%22 width=%224%22 height=%2215%22 rx=%221%22 fill=%22%237AA7FF%22/><rect x=%2221%22 y=%226%22 width=%224%22 height=%2219%22 rx=%221%22 fill=%22%23F0A44B%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F141B;
    --raised: #151C26;
    --rule: #232C39;
    --track: #1B2330;
    --text: #E7EAEF;
    --soft: #BAC2CE;
    --muted: #8A94A5;
    --deal: #7AA7FF;
    --exp: #4E6FAE;
    --dlc: #F0A44B;
    --late: #F08A7E;
    --good: #7FD1A3;
    --gold: #FFCE5C;
    --tickh: 0px;
    --u: min(1vw, 1.75vh);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; }
  body { color: var(--text); font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-variation-settings: "wdth" 100;
         font-size: calc(var(--u) * 1.05); line-height: 1.3; font-feature-settings: "tnum" 1, "lnum" 1; }
  .wide { font-variation-settings: "wdth" 116; }
  .narrow { font-variation-settings: "wdth" 82; }
  .hatch { background-image: repeating-linear-gradient(135deg, rgba(15,20,27,.6) 0 3px, transparent 3px 7px); }

  @keyframes drift { 0%{transform:translate(0,0)} 25%{transform:translate(.6%,.5%)} 50%{transform:translate(-.5%,.9%)} 75%{transform:translate(-.6%,-.4%)} 100%{transform:translate(0,0)} }
  @keyframes feed  { from{transform:translateY(0)} to{transform:translateY(-50%)} }
  @keyframes glow  { 0%,100%{opacity:0} 6%,21%{opacity:1} 27%{opacity:0} }

  .stage { position: fixed; top: 0; left: 0; right: 0; bottom: var(--tickh); padding: calc(var(--u) * 2.2) calc(var(--u) * 2.8) calc(var(--u) * 1.8);
           display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: calc(var(--u) * 1.6);
           animation: drift 360s ease-in-out infinite; opacity: 0; pointer-events: none; background: var(--ground); z-index: 1; }
  .stage.on { opacity: 1; pointer-events: auto; }
  /* Screen change: diagonal slice. The incoming screen sits on top and an angled edge sweeps across
     (a clip-path transition, so the burn-in drift animation is never restarted). */
  .stage.wiping { opacity: 1; z-index: 2; }

  /* ---------- header line */
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 2em; border-bottom: 1px solid var(--rule); padding-bottom: calc(var(--u) * 1); }
  .brand { display: flex; align-items: center; gap: calc(var(--u) * 1.3); min-width: 0; }
  .logo { flex: none; height: calc(var(--u) * 3.5); aspect-ratio: 1078 / 314; margin: calc(var(--u) * .3) calc(var(--u) * -.65) 0 calc(var(--u) * -.58);
          background: url(../chiirp-logo-2026-white.png) left center / contain no-repeat; }   /* the logo file in the repo root (MasterDash/chiirp-logo-2026-white.png) */
  .logo + h1 { padding-left: calc(var(--u) * 1.3); border-left: 1px solid var(--rule); }
  .top h1 { margin: 0; font-weight: 720; font-size: calc(var(--u) * 2.6); line-height: 1; letter-spacing: -.005em; }
  .top h1 span { color: var(--muted); font-weight: 500; }
  .top p { margin: 0; color: var(--muted); font-size: calc(var(--u) * 1); text-align: right; }
  .top p.stale { color: var(--late); }
  .clock { margin-left: 1.6em; color: var(--muted); }
  .clock b { color: var(--text); font-weight: 650; margin-left: .3em; }
  .clock .ago { margin-left: 0; }
  .monthbar { display: inline-block; vertical-align: middle; width: calc(var(--u) * 9); height: 4px; background: var(--track); border-radius: 99px; margin-left: .8em; overflow: hidden; }
  .monthbar i { display: block; height: 100%; background: var(--soft); border-radius: 99px; }

  /* ---------- screen 1 main: hero | race | feed */
  .s1main { display: grid; grid-template-columns: minmax(0, .92fr) minmax(0, 2.05fr) minmax(0, 1.15fr); gap: calc(var(--u) * 2.4); min-height: 0; }

  .hero { display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 1.2); min-height: 0; }
  .hero .lab { color: var(--muted); font-size: calc(var(--u) * 1.05); }
  .hero .big { font-weight: 760; font-size: calc(var(--u) * 5.2); line-height: .95; letter-spacing: -.01em; }
  .hero .exp { color: var(--soft); font-size: calc(var(--u) * 1.4); display: flex; align-items: center; gap: .5em; }
  .hero .exp b { color: var(--text); font-weight: 680; }
  .hero .exp i { width: calc(var(--u) * 1.6); height: calc(var(--u) * .7); border-radius: 99px; background-color: var(--deal); display: inline-block; }
  .facts { display: grid; gap: calc(var(--u) * .9); border-top: 1px solid var(--rule); padding-top: calc(var(--u) * 1.2); }
  .fact { display: flex; align-items: baseline; gap: .6em; }
  .fact b { font-weight: 700; font-size: calc(var(--u) * 2.1); min-width: 2.2em; }
  .fact span { color: var(--muted); font-size: calc(var(--u) * 1.05); }
  .fact span small { font-size: .82em; opacity: .85; }
  .fact.warn b { color: var(--late); }

  .race { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: calc(var(--u) * 1.6); min-height: 0;
          border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); padding: 0 calc(var(--u) * 1.6); }
  .col { position: relative; display: grid; grid-template-rows: auto minmax(calc(var(--u) * 5), .8fr) auto minmax(0, 1.15fr); justify-items: center; min-height: 0; min-width: 0; padding-top: calc(var(--u) * .4); }
  .col::before { content: ""; position: absolute; inset: 0 -12%; border-radius: calc(var(--u) * .8);
                 background: radial-gradient(60% 45% at 50% 60%, rgba(122,167,255,.10), transparent 70%); opacity: 0;
                 animation: glow 44s linear infinite; animation-delay: var(--d, 0s); pointer-events: none; }
  .col .amt { font-weight: 740; font-size: calc(var(--u) * 2.7); line-height: 1; white-space: nowrap; }
  .col .plus { color: var(--soft); font-size: calc(var(--u) * 1); margin-top: calc(var(--u) * .35); white-space: nowrap; }
  .col .plus b { color: var(--text); font-weight: 650; }
  .tube { position: relative; width: min(62%, calc(var(--u) * 6.5)); margin: calc(var(--u) * 1) 0; background: var(--track); border-radius: calc(var(--u) * .6); overflow: hidden; min-height: 0; }
  .tube i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; transition: height 1.4s cubic-bezier(.2,.8,.2,1), bottom 1.4s cubic-bezier(.2,.8,.2,1); }
  .tube i.hatch { opacity: .8; }
  .col .who { text-align: center; align-self: start; width: 100%; min-width: 0; overflow: hidden; }
  .col .who .nm { font-weight: 640; font-size: calc(var(--u) * 1.6); line-height: 1.1; white-space: nowrap; }
  .col .who .rk { color: var(--muted); font-weight: 500; margin-right: .35em; }
  .col .who .dt { color: var(--muted); font-size: calc(var(--u) * .95); margin-top: calc(var(--u) * .3); white-space: nowrap; }
  .col .who .dt.warn { color: var(--late); }
  .dwin { width: 100%; min-height: 0; overflow: hidden; margin-top: calc(var(--u) * .6); border-top: 1px solid var(--rule);
          -webkit-mask-image: linear-gradient(transparent, #000 8%, #000 86%, transparent); mask-image: linear-gradient(transparent, #000 8%, #000 86%, transparent); }
  .dl { list-style: none; margin: 0; padding: 0; }
  .dl.moving { animation: feed var(--feedtime, 40s) linear infinite; }
  .dl li { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: .5em; padding: calc(var(--u) * .45) 0; border-bottom: 1px solid var(--rule); text-align: left; }
  .dl .dco { font-size: calc(var(--u) * .88); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dl .dv { font-size: calc(var(--u) * .88); font-weight: 650; text-align: right; }
  .dl .dwhen { grid-column: 1 / -1; font-size: calc(var(--u) * .75); color: var(--muted); }
  .dl li.due .dco, .dl li.due .dv { color: var(--soft); }
  .dl li.due .dwhen { color: var(--deal); }
  .dl li.none { display: block; color: var(--muted); font-size: calc(var(--u) * .85); border: 0; text-align: center; }
  .list .why.bad { color: var(--late); }
  .col .who .owed { margin-top: calc(var(--u) * .3); color: var(--muted); font-size: calc(var(--u) * .8); line-height: 1.35; opacity: .85; }
  .col .who .owed div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .col .who .owed .more { font-style: italic; }

  .feedcol { background: var(--raised); border-radius: calc(var(--u) * .9); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; overflow: hidden; }
  .feedhead { padding: calc(var(--u) * 1.4) calc(var(--u) * 1.6) calc(var(--u) * .8); display: flex; justify-content: space-between; align-items: baseline; }
  .feedhead h2 { margin: 0; font-weight: 650; font-size: calc(var(--u) * 1.5); }
  .feedhead span { color: var(--muted); font-size: calc(var(--u) * .95); }
  .win { position: relative; overflow: hidden; min-height: 0; -webkit-mask-image: linear-gradient(transparent, #000 6%, #000 88%, transparent); mask-image: linear-gradient(transparent, #000 6%, #000 88%, transparent); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list.moving { animation: feed var(--feedtime, 90s) linear infinite; }
  .list li { display: grid; grid-template-columns: calc(var(--u) * .45) minmax(0, 1fr) auto; gap: calc(var(--u) * .2) calc(var(--u) * 1); padding: calc(var(--u) * .95) calc(var(--u) * 1.6); border-top: 1px solid var(--rule); align-items: center; }
  .list .tick { width: calc(var(--u) * .45); height: calc(var(--u) * 2.1); border-radius: 99px; grid-row: 1 / span 2; }
  .list .co { font-weight: 600; font-size: calc(var(--u) * 1.1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .v { font-weight: 700; font-size: calc(var(--u) * 1.35); text-align: right; white-space: nowrap; }
  .list .why { color: var(--muted); font-size: calc(var(--u) * .92); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .why.warn { color: var(--dlc); }
  .list .side { color: var(--soft); font-size: calc(var(--u) * .92); text-align: right; white-space: nowrap; }
  .empty { color: var(--muted); padding: calc(var(--u) * 1.2) calc(var(--u) * 1.6); }
  .list li.empty { display: block; border-top: 0; }

  /* ---------- screen 1 bottom: six months, one small chart per person */
  .multiples { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: calc(var(--u) * 2.4); border-top: 1px solid var(--rule); padding-top: calc(var(--u) * 1.1); }
  .mult { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto; gap: calc(var(--u) * .3) calc(var(--u) * 1); }
  .mult .nm { font-size: calc(var(--u) * 1.05); color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mult .tot { text-align: right; font-weight: 680; font-size: calc(var(--u) * 1.15); white-space: nowrap; }
  .mult .tot span { color: var(--muted); font-weight: 400; font-size: calc(var(--u) * .9); margin-left: .35em; }
  .mini { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: calc(var(--u) * .5); align-items: end; height: calc(var(--u) * 4.2); }
  .mini i { display: block; border-radius: 3px 3px 1px 1px; background: var(--exp); min-height: 2px; }
  .mini i.now { background: var(--deal); }
  .mini i.dlc { background: #9A6A33; }
  .mini i.dlc.now { background: var(--dlc); }
  .mlabels { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: calc(var(--u) * .5); color: var(--muted); font-size: calc(var(--u) * .85); text-align: center; }
  .mlabels .now { color: var(--text); font-weight: 600; }
  .foot { color: var(--muted); font-size: calc(var(--u) * .85); margin-top: calc(var(--u) * .9); display: flex; justify-content: space-between; gap: 2em; }
  .key { display: flex; gap: 1.4em; white-space: nowrap; }
  .key i { display: inline-block; width: 1.6em; height: .6em; border-radius: 99px; margin-right: .45em; vertical-align: middle; background-color: var(--deal); }

  /* ---------- screen 1, spotlight layout */
  .s1main { grid-template-columns: minmax(0, .9fr) minmax(0, 2.1fr) !important; }
  .left { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: calc(var(--u) * 1.4); min-height: 0; }
  .left .hero { justify-content: flex-start; gap: calc(var(--u) * .6); }
  .left .hero .big { font-size: calc(var(--u) * 4.2); }
  .left .facts { padding-top: calc(var(--u) * .8); }
  .race2 { display: grid; align-content: start; gap: calc(var(--u) * 1.1); border-top: 1px solid var(--rule); padding-top: calc(var(--u) * 1.1); min-height: 0; }
  .lane { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: calc(var(--u) * .3) calc(var(--u) * .8); padding: calc(var(--u) * .45) calc(var(--u) * .7);
          border-radius: calc(var(--u) * .5); border-left: 3px solid transparent; transition: background .5s, border-color .5s; }
  .lane.on { background: var(--raised); border-left-color: var(--deal); }
  .lane .nm { font-weight: 640; font-size: calc(var(--u) * 1.35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lane .nm .rk { color: var(--muted); font-weight: 500; margin-right: .4em; }
  .lane .amt { font-weight: 720; font-size: calc(var(--u) * 1.5); text-align: right; white-space: nowrap; }
  .lane .lbar { grid-column: 1 / -1; position: relative; height: calc(var(--u) * .55); background: var(--track); border-radius: 99px; overflow: hidden; }
  .lane .lbar i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: 99px; transition: width 1.2s cubic-bezier(.2,.8,.2,1), left 1.2s cubic-bezier(.2,.8,.2,1); }
  .lane .sub { grid-column: 1 / -1; color: var(--muted); font-size: calc(var(--u) * .9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lane .sub b { color: var(--soft); font-weight: 600; }
  .spot { position: relative; background: var(--raised); border-radius: calc(var(--u) * .9); padding: calc(var(--u) * 1.5) calc(var(--u) * 1.8) calc(var(--u) * 1.2); min-height: 0; overflow: hidden; }
  .spotin { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: calc(var(--u) * 1.1); height: 100%; transition: opacity .45s ease, transform .45s ease; }
  .spotin.out { opacity: 0; transform: translateY(calc(var(--u) * .6)); }
  .spothead { display: flex; align-items: baseline; justify-content: space-between; gap: 1em; }
  .spothead h2 { margin: 0; font-weight: 740; font-size: calc(var(--u) * 3); line-height: 1; white-space: nowrap; }
  .spothead .stats { color: var(--muted); font-size: calc(var(--u) * 1.1); text-align: right; }
  .spothead .stats b { color: var(--text); font-weight: 700; font-size: calc(var(--u) * 1.8); margin-right: .25em; }
  .spothead .stats .due b { color: var(--soft); font-size: calc(var(--u) * 1.3); }
  .spotcols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(var(--u) * 1.6); min-height: 0; }
  .scol { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; border-top: 1px solid var(--rule); }
  .scol h3 { margin: 0; padding: calc(var(--u) * .7) 0 calc(var(--u) * .3); font-weight: 640; font-size: calc(var(--u) * 1.1); }
  .scol h3 span { color: var(--muted); font-weight: 500; margin-left: .4em; }
  .scol .list li { padding-left: 0; padding-right: 0; grid-template-columns: calc(var(--u) * .4) minmax(0, 1fr) auto; }
  .scol .list .co { font-size: calc(var(--u) * 1.05); }
  .scol .list .v { font-size: calc(var(--u) * 1.15); }
  .dots { position: absolute; right: calc(var(--u) * 1.8); bottom: calc(var(--u) * .5); display: flex; gap: 6px; }
  .dots i { width: calc(var(--u) * 1.3); height: 3px; border-radius: 2px; background: var(--rule); }
  .dots i.on { background: var(--text); }

  /* ---------- screen 2: retention */
  .s2main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.05fr); gap: calc(var(--u) * 2.2); min-height: 0; }
  .kept { display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 1.1); min-height: 0; }
  .kept .big { font-weight: 760; font-size: calc(var(--u) * 5.4); line-height: .95; }
  .kept .lab { color: var(--muted); font-size: calc(var(--u) * 1.05); }
  .kept .trail { color: var(--muted); font-size: calc(var(--u) * 1.1); margin-top: calc(var(--u) * -.4); }
  .kept .trail b { color: var(--soft); font-weight: 650; }
  .kfacts { display: grid; gap: calc(var(--u) * .9); border-top: 1px solid var(--rule); padding-top: calc(var(--u) * 1.2); margin-top: calc(var(--u) * .6); }
  .kf { display: flex; align-items: baseline; gap: .6em; }
  .mrrpath { display: flex; align-items: baseline; gap: .5em; margin-top: calc(var(--u) * .8); max-width: 100%; overflow: hidden; white-space: nowrap; }
  .mrrpath b { font-weight: 720; font-size: calc(var(--u) * 2.3); }
  .mrrpath .arrow { color: var(--muted); font-size: calc(var(--u) * 1.8); }
  .kept .cap { color: var(--muted); font-size: calc(var(--u) * .95); margin-top: calc(var(--u) * .2); }
  .kf b { font-weight: 700; font-size: calc(var(--u) * 1.7); min-width: 5.2em; }
  .kf span { color: var(--muted); font-size: calc(var(--u) * 1); }
  .scale { position: relative; height: calc(var(--u) * 5.2); margin-top: calc(var(--u) * .4); }
  .scale .track { position: absolute; left: 0; right: 0; top: calc(var(--u) * 2.2); height: calc(var(--u) * .8); background: var(--track); border-radius: 99px; overflow: hidden; }
  .scale .track i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--deal); }
  .scale .track i.proj { background-color: var(--dlc); opacity: .85; }
  .scale .mk { position: absolute; top: 0; transform: translateX(-50%); text-align: center; font-size: calc(var(--u) * .85); color: var(--soft); white-space: nowrap; }
  .scale .mk.low { top: auto; bottom: 0; color: var(--dlc); }
  .scale .ends { position: absolute; bottom: 0; color: var(--muted); font-size: calc(var(--u) * .8); }
  .mrr { display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u) * .5) calc(var(--u) * 1.2); border-top: 1px solid var(--rule); padding-top: calc(var(--u) * 1.1); font-size: calc(var(--u) * 1.05); }
  .mrr span { color: var(--muted); }
  .mrr b { font-weight: 680; text-align: right; }
  .pane { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; border-left: 1px solid var(--rule); padding-left: calc(var(--u) * 2.2); }
  .pane h2 { margin: 0; font-weight: 650; font-size: calc(var(--u) * 1.5); }
  .pane .sum { margin: calc(var(--u) * .3) 0 calc(var(--u) * .7); color: var(--muted); font-size: calc(var(--u) * 1); }
  .pane .sum b { display: block; color: var(--text); font-weight: 740; font-size: calc(var(--u) * 2.6); line-height: 1.05; margin-bottom: calc(var(--u) * .2); }
  .pane .list li { padding-left: 0; padding-right: 0; }
  .tick.lost { background: var(--late); } .tick.sudden { background: var(--dlc); } .tick.soon { background: var(--soft); }
  .srcs { display: grid; gap: calc(var(--u) * .95); align-content: start; min-height: 0; overflow: hidden; }
  .pie { display: block; flex: none; width: calc(var(--u) * 10); height: calc(var(--u) * 10); margin: calc(var(--u) * .3) auto calc(var(--u) * .6); }
  .plegend { display: grid; gap: calc(var(--u) * .45); }
  .prow { display: grid; grid-template-columns: calc(var(--u) * .9) minmax(0, 1fr) auto; column-gap: calc(var(--u) * .7); align-items: baseline; }
  .prow i { width: calc(var(--u) * .9); height: calc(var(--u) * .9); border-radius: 3px; align-self: center; }
  .prow .nm { font-size: calc(var(--u) * 1.02); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow .v { font-weight: 700; font-size: calc(var(--u) * 1.15); text-align: right; white-space: pre; }
  .prow .yr { grid-column: 2 / -1; color: var(--muted); font-size: calc(var(--u) * .85); }
  .prow.zero .nm, .prow.zero .v { color: var(--muted); }
  .srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: calc(var(--u) * .3) 1em; }
  .srow .nm { font-size: calc(var(--u) * 1.05); }
  .srow .v { font-weight: 700; font-size: calc(var(--u) * 1.25); text-align: right; }
  .srow .tr { grid-column: 1 / -1; height: calc(var(--u) * .4); background: var(--track); border-radius: 99px; overflow: hidden; }
  .srow .tr i { display: block; height: 100%; background: var(--deal); border-radius: 99px; }
  .srow .yr { grid-column: 1 / -1; color: var(--muted); font-size: calc(var(--u) * .88); }
  .s2note { color: var(--muted); font-size: calc(var(--u) * .85); border-top: 1px solid var(--rule); padding-top: calc(var(--u) * .9); }
  .s2note .formula { color: var(--soft); font-size: calc(var(--u) * .9); line-height: 1.55; margin-bottom: calc(var(--u) * .5); }
  .s2note .formula b { color: var(--text); font-weight: 650; }

  /* ---------- new sale celebration: "gold rush" (both screens) */
  .party { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; pointer-events: none;
           background: rgba(5,8,12,.965); opacity: 0; transition: opacity .5s ease; }
  .party.on { display: flex; } .party.show { opacity: 1; }
  .party canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .gflash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  .party.show .gflash { animation: gflash .55s ease-out; }
  @keyframes gflash { 0% { opacity: .85 } 100% { opacity: 0 } }
  .gring { position: absolute; left: 50%; top: 50%; width: 2vmin; height: 2vmin; margin: -1vmin 0 0 -1vmin; border: .18vmin solid var(--gold); border-radius: 50%; opacity: 0; }
  .party.show .gring { animation: gring 1.4s ease-out forwards; }
  .party.show .gring.r2 { animation-delay: .22s; } .party.show .gring.r3 { animation-delay: .44s; }
  @keyframes gring { 0% { opacity: .9; transform: scale(1) } 100% { opacity: 0; transform: scale(65) } }
  .gshake { animation: gshake .55s; }
  @keyframes gshake { 0%,100% { transform: none } 20% { transform: translate(-.6vmin,.3vmin) } 40% { transform: translate(.5vmin,-.4vmin) } 60% { transform: translate(-.4vmin,-.2vmin) } 80% { transform: translate(.3vmin,.4vmin) } }
  .pcard { position: relative; text-align: center; max-width: 84vw; opacity: 0; transition: opacity .5s ease .45s; }
  .party.show .pcard { opacity: 1; }
  .pcard .kick { color: var(--gold); font-weight: 700; letter-spacing: .22em; text-transform: uppercase; font-size: calc(var(--u) * 1.4); }
  .pcard .who { font-weight: 760; font-size: calc(var(--u) * 6.4); line-height: 1.05; margin: calc(var(--u) * .5) 0 calc(var(--u) * .6); color: var(--text);
                transform: scale(.6); transition: transform .75s cubic-bezier(.2, 1.5, .4, 1) .45s; }
  .party.show .pcard .who { transform: none; }
  .pcard .what { color: var(--soft); font-size: calc(var(--u) * 2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcard .amt { margin-top: calc(var(--u) * 1.1); font-weight: 760; font-size: calc(var(--u) * 5); color: var(--gold); }
  .pcard .amt small { color: var(--muted); font-weight: 500; font-size: .32em; margin-left: .4em; }
  .lane.golden { background: rgba(255,206,92,.14); border-left-color: var(--gold); box-shadow: inset 0 0 0 1px rgba(255,206,92,.6); transition: background .4s; }
  .lane.golden .amt { color: var(--gold); }

  /* ---------- 7-day banner (both screens) */
  @keyframes tick { from{transform:translateX(0)} to{transform:translateX(-50%)} }
  .ticker { position: fixed; left: 0; right: 0; bottom: 0; height: var(--tickh); background: var(--raised); border-top: 1px solid var(--rule);
            overflow: hidden; display: none; align-items: center; z-index: 5;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent); mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent); }
  .ticker.on { display: flex; }
  .ticker .track { display: flex; white-space: nowrap; animation: tick var(--ticktime, 120s) linear infinite; }
  .ticker .grp { display: flex; align-items: center; gap: calc(var(--u) * 2.6); padding-right: calc(var(--u) * 2.6); }
  .ticker .hd { font-weight: 680; color: var(--text); background: var(--track); padding: .3em .9em; border-radius: 99px; font-size: calc(var(--u) * .95); }
  .ticker .it { font-size: calc(var(--u) * 1.15); color: var(--muted); }
  .ticker .it b { color: var(--text); font-weight: 680; margin-left: .4em; }
  .ticker .it small { font-size: .82em; margin-left: .35em; }
  .ticker .it .d { font-size: .82em; margin-left: .55em; font-weight: 600; }
  .ticker .when { font-size: .78em; color: var(--muted); margin-left: .45em; padding: .1em .45em; border: 1px solid var(--rule); border-radius: .4em; }
  .ticker .d.good { color: var(--good); } .ticker .d.bad { color: var(--late); } .ticker .d.flat { color: var(--muted); }
  /* two-line banner: trailing 7 days on top, trailing 30 days underneath */
  .ticker .hd2 { display: inline-grid; grid-auto-rows: auto; row-gap: .15em; background: var(--track); padding: .35em .9em; border-radius: .7em;
                 font-size: calc(var(--u) * .82); color: var(--muted); line-height: 1.15; }
  .ticker .hd2 b { color: var(--text); font-weight: 680; font-size: 1.12em; }
  .ticker .it.two { display: inline-grid; grid-template-columns: auto auto; grid-template-rows: auto auto; column-gap: .75em; row-gap: .1em; align-items: baseline; line-height: 1.15; }
  .ticker .it.two .lb { grid-row: 1 / span 2; align-self: center; }
  .ticker .it.two .l1, .ticker .it.two .l2 { white-space: nowrap; }
  .ticker .it.two .l1 b { margin-left: 0; }
  .ticker .it.two .l2 { font-size: .8em; }
  .ticker .it.two .l2 b { margin-left: 0; font-weight: 620; }
  .ticker .it.two small, .ticker .it.two .d { margin-left: .55em; }
  .ticker .it.two .k { color: var(--muted); font-size: .82em; margin-right: .5em; letter-spacing: .02em; }

  .error { grid-row: 1 / -1; align-self: center; justify-self: center; max-width: 60ch; color: var(--soft); font-size: calc(var(--u) * 1.4); }
  .error h2 { color: var(--text); margin: 0 0 .4em; font-size: calc(var(--u) * 2.4); }
</style>
</head>
<body>

<div class="stage on" id="stage">
  <div class="top">
    <div class="brand"><span class="logo" role="img" aria-label="CHIIRP"></span><h1 class="wide" id="month">Sales</h1></div>
    <p id="monthsub">Loading the latest numbers</p>
  </div>
  <div class="s1main" id="main">
    <section class="left">
      <div class="hero" aria-label="Team this month" id="hero"></div>
      <div class="race2" id="reps" aria-label="New revenue collected by person"></div>
    </section>
    <section class="spot" id="spot" aria-live="polite">
      <div class="spotin" id="spotin">
        <div class="spothead" id="spothead"></div>
        <div class="spotcols">
          <div class="scol"><h3>Paid this month <span id="sp-paid-n"></span></h3><div class="win"><ul class="list" id="sp-paid"></ul></div></div>
          <div class="scol"><h3>Due this month <span id="sp-due-n"></span></h3><div class="win"><ul class="list" id="sp-due"></ul></div></div>
          <div class="scol"><h3>First payment issues <span id="sp-iss-n"></span></h3><div class="win"><ul class="list" id="sp-iss"></ul></div></div>
        </div>
      </div>
      <div class="dots" id="spotdots"></div>
    </section>
  </div>
  <footer id="foot"></footer>
</div>

<div class="stage" id="stage2" aria-hidden="true">
  <div class="top">
    <div class="brand"><span class="logo" role="img" aria-label="CHIIRP"></span><h1 class="wide" id="r-title">Retention</h1></div>
    <p id="r-sub"></p>
  </div>
  <div class="s2main">
    <section class="kept" aria-label="MRR kept this month" id="r-kept"></section>
    <section class="pane" aria-labelledby="r-h1"><h2 id="r-h1">Churned this month</h2><p class="sum" id="r-lostsum"></p><div class="win"><ul class="list" id="r-lost"></ul></div></section>
    <section class="pane" aria-labelledby="r-h2"><h2 id="r-h2">Ending this month</h2><p class="sum" id="r-soonsum"></p><div class="win"><ul class="list" id="r-soon"></ul></div></section>
    <section class="pane" aria-labelledby="r-h3"><h2 id="r-h3">New revenue by source</h2><p class="sum" id="r-srcsum"></p><div class="srcs" id="r-src"></div></section>
  </div>
  <div class="s2note narrow" id="r-note"></div>
</div>

<div class="party" id="party" aria-live="polite"><div class="gflash"></div><div class="gring"></div><div class="gring r2"></div><div class="gring r3"></div><canvas id="confetti"></canvas><div class="pcard" id="pcard"></div></div>
<div class="ticker" id="ticker" aria-label="Last 7 and 30 days"><div class="track" id="tickTrack"></div></div>

<script>
(function () {
  var money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var C = { deal: 'var(--deal)', exp: 'var(--exp)', dlc: 'var(--dlc)' };
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function nice(n) { return String(n || '').replace(/\b([a-z])/g, function (c) { return c.toUpperCase(); }); }
  function first(n) { return nice(n).split(' ')[0]; }
  function monthOf(mk) { return MONTHS[Number(mk.slice(5, 7)) - 1]; }
  function addMonths(mk, n) { var y = +mk.slice(0, 4), m = +mk.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + (m < 9 ? '0' : '') + (m + 1); }
  function day(d) { return d ? new Date(d + 'T12:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : ''; }
  function plural(k, one, many) { return k + ' ' + (k === 1 ? one : many); }
  function coName(c) { c = String(c || ''); return /^cus_\w+$/.test(c) ? 'Stripe customer \u2026' + c.slice(-8) : (c || 'Account with no name'); }
  function fetchJson(f) {
    return fetch('data/' + f + '?v=' + Date.now(), { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(f + ' could not be loaded (HTTP ' + r.status + ')'); return r.json();
    });
  }
  // Scrolling: 20% faster than the original pace, and a data refresh never restarts a scroll.
  var SPEED = 1.2;
  function loopPos(el) {            // how far through its loop a scroll is (0 to 1), or null
    var a = el.getAnimations && el.getAnimations()[0];
    if (!a || a.currentTime == null) return null;
    var dur = a.effect.getTiming().duration; return dur ? (a.currentTime % dur) / dur : null;
  }
  function resumeAt(el, pos) {      // put a (re)started scroll back where it was
    if (pos == null) return;
    requestAnimationFrame(function () { var a = el.getAnimations && el.getAnimations()[0];
      if (a) a.currentTime = pos * a.effect.getTiming().duration; });
  }
  function fillList(ul, rows, make, empty, secsPerRow) {
    var pos = loopPos(ul);
    ul.replaceChildren(); ul.classList.remove('moving');
    if (!rows.length) { ul.appendChild(el('li', 'empty', empty)); return; }
    var box = ul.parentNode;
    rows.forEach(function (r) { ul.appendChild(make(r)); });
    if (ul.scrollHeight > box.clientHeight + 4) {              // scroll only when it doesn't fit
      rows.forEach(function (r) { ul.appendChild(make(r)); });
      ul.style.setProperty('--feedtime', (Math.max(40, rows.length * (secsPerRow || 8)) / SPEED).toFixed(1) + 's'); ul.classList.add('moving');
      resumeAt(ul, pos);
    }
  }


  // ======================================================= screen 1: sales
  function render(S, M, D) {
    var mk = S.meta.month, now = new Date();
    var dim = new Date(+mk.slice(0, 4), +mk.slice(5, 7), 0).getDate(), today = Math.min(now.getDate(), dim);
    var h = $('month'); h.replaceChildren(document.createTextNode(monthOf(mk) + ' '));
    h.appendChild(el('span', null, 'sales'));
    var sub = $('monthsub'); sub.replaceChildren(document.createTextNode('Day ' + today + ' of ' + dim));
    var mb = el('span', 'monthbar'), mbi = el('i'); mbi.style.width = (100 * today / dim) + '%'; mb.appendChild(mbi); sub.appendChild(mb);
    var clock = el('span', 'clock'); clock.id = 'clock'; sub.appendChild(clock); builtAt = S.meta.builtAt; tickClock();

    // ---- hero
    var t = S.team.thisMonth, tp = S.team.pending || {}, ta = S.team.awaiting || {}, hero = $('hero'); hero.replaceChildren();
    // 10DLC fees are not MRR: the big number is new MRR from deals only; 10DLC is its own line.
    var dealMrr = (t.newCredited || 0) + (t.expCredited || 0), dlc = t.dlcCredited || 0;
    if (!dealMrr && t.credited && !dlc) dealMrr = t.credited;
    var dealExp = tp.dealAmount != null ? tp.dealAmount : (tp.amount || 0) - (tp.dlcAmount || 0);
    hero.appendChild(el('div', 'lab', 'New MRR collected this month'));
    hero.appendChild(el('div', 'big wide', money.format(dealMrr)));
    if (dealExp > 0) { var ex = el('div', 'exp'); var sw = el('i', 'hatch'); ex.appendChild(sw); ex.appendChild(el('b', null, '+' + money.format(dealExp)));
                       ex.appendChild(document.createTextNode(' expected this month')); hero.appendChild(ex); }
    var facts = el('div', 'facts');
    [[String(t.dealsCollected), t.dealsCollected === 1 ? 'deal paid' : 'deals paid', '', '']].forEach(function (f) {
      if (f[1].indexOf('10DLC') > -1 && !dlc && !(tp.dlcAmount > 0)) return;
      var d = el('div', 'fact ' + f[2]); d.appendChild(el('b', 'wide', f[0]));
      var lab = el('span', null, f[1]); if (f[3]) { lab.appendChild(el('br')); lab.appendChild(el('small', null, f[3])); }
      d.appendChild(lab); facts.appendChild(d);
    });
    hero.appendChild(facts);

    // ---- race: one lane per person (Josh included), solid = collected, hatched = expected this month
    var reps = S.reps.filter(function (r) { return r.onRoster; })
                     .sort(function (a, b) { return b.thisMonth.credited - a.thisMonth.credited || (a.ae < b.ae ? -1 : 1); });
    var max = Math.max.apply(null, reps.map(function (r) { return r.thisMonth.credited + ((r.pending && r.pending.amount) || 0); }).concat([1]));
    var race = $('reps'); race.replaceChildren();
    var isDlcRep = function (r) { var x = r.thisMonth, pd = r.pending || {};
      return (x.dlcCredited || 0) + (pd.dlcAmount || 0) > (x.newCredited || 0) + (x.expCredited || 0) + (pd.dealAmount || 0); };
    reps.forEach(function (r, i) {
      var x = r.thisMonth, pd = r.pending || {}, dlcRep = isDlcRep(r), color = dlcRep ? C.dlc : C.deal;
      var lane = el('div', 'lane'); lane.dataset.ae = r.ae;
      var nm = el('div', 'nm'); nm.appendChild(el('span', 'rk', String(i + 1))); nm.appendChild(document.createTextNode(nice(r.ae))); lane.appendChild(nm);
      lane.appendChild(el('div', 'amt wide', money.format(x.credited)));
      var bar = el('div', 'lbar'), solid = el('i'), hatch = el('i', 'hatch');
      solid.style.backgroundColor = color; hatch.style.backgroundColor = color; bar.appendChild(hatch); bar.appendChild(solid); lane.appendChild(bar);
      var sub = el('div', 'sub');
      if (dlcRep) sub.textContent = plural(x.dlcCount || 0, '10DLC fee', '10DLC fees') + ' (not MRR)' + (pd.amount ? ', +' + money.format(pd.amount) + ' this month' : '');
      else { sub.appendChild(document.createTextNode(plural(x.dealsCollected || 0, 'deal paid', 'deals paid')));
             if (pd.amount) { sub.appendChild(document.createTextNode(', ')); sub.appendChild(el('b', null, '+' + money.format(pd.amount))); sub.appendChild(document.createTextNode(' this month')); } }
      lane.appendChild(sub); race.appendChild(lane);
      var wS = 100 * x.credited / max, wH = 100 * (pd.amount || 0) / max;
      requestAnimationFrame(function () { requestAnimationFrame(function () { solid.style.width = wS + '%'; hatch.style.left = wS + '%'; hatch.style.width = wH + '%'; }); });
    });

    // ---- spotlight data: deal reps only (never the 10DLC rep)
    var spotReps = reps.filter(function (r) { return !isDlcRep(r); });
    var names = {}; spotReps.forEach(function (r) { names[r.ae] = 1; });
    var SP = {};
    spotReps.forEach(function (r) { SP[r.ae] = { rep: r, paid: [], due: [], issues: [] }; });
    var orphanIssues = 0;
    D.rows.forEach(function (d) {
      var s2 = SP[d.ae];
      if (d.issue && !s2) { orphanIssues++; return; }
      if (!s2) return;
      if (d.status === 'Collected' && d.creditedMonth === mk) s2.paid.push(d);
      else if (d.status === 'Awaiting first payment' && d.billsThisMonth && !d.issue) s2.due.push(d);
      if (d.issue) s2.issues.push(d);
    });
    spotReps.forEach(function (r) { var s2 = SP[r.ae];
      s2.paid.sort(function (a, b) { return (b.collectedDate || '') < (a.collectedDate || '') ? -1 : 1; });
      s2.due.sort(function (a, b) { return (b.booked || 0) - (a.booked || 0); });
      s2.issues.sort(function (a, b) { return (/failed|stuck/i.test(b.issue) ? 1 : 0) - (/failed|stuck/i.test(a.issue) ? 1 : 0) || (b.issueDays || 0) - (a.issueDays || 0); });
    });
    spot.order = spotReps.map(function (r) { return r.ae; }); spot.data = SP; spot.mk = mk;
    renderSpot(false);

    // ---- footnote and key
    var foot = $('foot'); foot.replaceChildren();
    var fl = el('div', 'foot narrow');
    fl.appendChild(el('span', null, 'Revenue counts in the month it\u2019s collected: a deal\u2019s first month of MRR when the customer first pays. 10DLC fees are not MRR. ' +
      'The spotlight changes every 20 seconds.' + (orphanIssues ? ' ' + plural(orphanIssues, 'first-payment issue is', 'first-payment issues are') + ' on deals with no rep: see the Data Issues tab.' : '')));
    var key = el('span', 'key'); var k1 = el('span'); k1.appendChild(el('i')); k1.appendChild(document.createTextNode('Collected'));
    var k2 = el('span'); k2.appendChild(el('i', 'hatch')); k2.appendChild(document.createTextNode('Expected this month')); key.appendChild(k1); key.appendChild(k2);
    fl.appendChild(key); foot.appendChild(fl);
  }

  // ======================================================= spotlight: one rep at a time, 20 seconds each
  var spot = { order: [], data: {}, idx: 0, current: null, mk: '' };
  function renderSpot(advance) {
    if (!spot.order.length) { $('spothead').replaceChildren(el('h2', 'wide', 'No deals yet')); return; }
    if (advance) spot.idx = (spot.idx + 1) % spot.order.length;
    else { var keep = spot.order.indexOf(spot.current); spot.idx = keep > -1 ? keep : 0; }   // a data refresh keeps the same rep
    var ae = spot.order[spot.idx], S2 = spot.data[ae], r = S2.rep, x = r.thisMonth, pd = r.pending || {};
    var changing = spot.current !== null && spot.current !== ae; spot.current = ae;
    var draw = function () {
      var head = $('spothead'); head.replaceChildren();
      head.appendChild(el('h2', 'wide', nice(r.ae)));
      var st = el('div', 'stats');
      var a = el('span'); a.appendChild(el('b', 'wide', money.format(x.credited))); a.appendChild(document.createTextNode(' collected, ' + plural(x.dealsCollected || 0, 'deal', 'deals')));
      st.appendChild(a);
      if (pd.amount) { st.appendChild(el('br')); var b = el('span', 'due'); b.appendChild(el('b', 'wide', '+' + money.format(pd.amount))); b.appendChild(document.createTextNode(' expected this month')); st.appendChild(b); }
      head.appendChild(st);
      $('sp-paid-n').textContent = S2.paid.length || ''; $('sp-due-n').textContent = S2.due.length || ''; $('sp-iss-n').textContent = S2.issues.length || '';
      fillList($('sp-paid'), S2.paid, function (d) {
        var li = el('li'); var tk = el('span', 'tick'); tk.style.background = d.type === 'Expansion' ? C.exp : C.deal; li.appendChild(tk);
        li.appendChild(el('span', 'co', d.company || 'Unnamed company')); li.appendChild(el('span', 'v wide', money.format(d.credited)));
        li.appendChild(el('span', 'why', (d.type === 'Expansion' ? 'Expansion, ' : '') + (d.collectedDate ? 'paid ' + day(d.collectedDate) : 'paid in ' + monthOf(spot.mk))));
        li.appendChild(el('span', 'side', '')); return li;
      }, 'Nothing paid yet this month.', 7);
      fillList($('sp-due'), S2.due, function (d) {
        var li = el('li'); var tk = el('span', 'tick hatch'); tk.style.backgroundColor = C.deal; li.appendChild(tk);
        li.appendChild(el('span', 'co', d.company || 'Unnamed company')); li.appendChild(el('span', 'v wide', money.format(d.booked || 0)));
        li.appendChild(el('span', 'why', 'won ' + day(d.close))); li.appendChild(el('span', 'side', '')); return li;
      }, 'Nothing else due this month.', 7);
      fillList($('sp-iss'), S2.issues, function (d) {
        var bad = /failed|stuck/i.test(d.issue);
        var li = el('li'); var tk = el('span', 'tick'); tk.style.background = bad ? 'var(--late)' : 'var(--dlc)'; li.appendChild(tk);
        li.appendChild(el('span', 'co', d.company || 'Unnamed company')); li.appendChild(el('span', 'v wide', money.format(d.booked || 0)));
        li.appendChild(el('span', 'why' + (bad ? ' bad' : ''), d.issue + (d.issueDays != null ? ', ' + d.issueDays + 'd' : ''))); li.appendChild(el('span', 'side', '')); return li;
      }, 'No first-payment problems.', 7);
      // dots and the race highlight
      var dots = $('spotdots'); dots.replaceChildren(); spot.order.forEach(function (n, i) { dots.appendChild(el('i', i === spot.idx ? 'on' : '')); });
      [].forEach.call(document.querySelectorAll('#reps .lane'), function (l) { l.classList.toggle('on', l.dataset.ae === ae); });
    };
    var inn = $('spotin');
    if (changing) { inn.classList.add('out'); setTimeout(function () { draw(); inn.classList.remove('out'); }, 450); }
    else draw();
  }
  setInterval(function () { if (spot.order.length > 1) renderSpot(true); }, 20000);

  // ======================================================= last refreshed clock (Mountain time: MST, MDT in summer)

  // already seen are remembered in this browser, so a reload (nightly, or a new page version) neither
  // repeats a celebration nor misses one; the very first load on a new TV only remembers, it never
  // celebrates the backlog. Several new deals at once play one after another.

      seen = {}; rows.forEach(function (r) { seen[r.id] = 1; }); store(false, JSON.stringify(seen)); return;
    }
    var cut = new Date(Date.now() - CELEBRATE_DAYS * 864e5), cutDay = cut.getFullYear() + '-' + String(cut.getMonth() + 1).padStart(2, '0') + '-' + String(cut.getDate()).padStart(2, '0');
    rows.forEach(function (r) {
      if (seen[r.id]) return;
      seen[r.id] = 1;
      if (r.close && r.close >= cutDay) partyQueue.push(r);
    });
    store(false, JSON.stringify(seen));
    nextParty();
  }
  function nextParty() {
    if (partyOn || !partyQueue.length) return;
    partyOn = true;
    var r = partyQueue.shift(), box = $('party'), card = $('pcard');
    card.replaceChildren();
    card.appendChild(el('div', 'kick', r.type === 'Expansion' ? 'New expansion' : 'New sale'));
    card.appendChild(el('div', 'who wide', nice(r.ae)));
    card.appendChild(el('div', 'what', r.company));
    var amt = null;
    if (r.booked) { amt = el('div', 'amt wide', money.format(0)); amt.appendChild(el('small', null, 'MRR')); card.appendChild(amt); }
    box.classList.add('on'); void box.offsetWidth; box.classList.add('show');
    if (!reduceMotion) {
      ['stage', 'stage2', 'ticker'].forEach(function (id) { var x = $(id); if (x) { x.classList.remove('gshake'); void x.offsetWidth; x.classList.add('gshake'); } });
      goldRush($('confetti'), CELEBRATE_MS - 1000);
    }
    if (amt) countUp(amt, r.booked, reduceMotion ? 0 : 2200, 600);
    setTimeout(function () {
      box.classList.remove('show');
      setTimeout(function () {
        box.classList.remove('on'); partyOn = false;
        // then the rep's row on the leaderboard glows gold for a few seconds
        [].forEach.call(document.querySelectorAll('#reps .lane'), function (l) {
          if (String(l.dataset.ae).toLowerCase() !== String(r.ae).toLowerCase()) return;
          l.classList.add('golden'); setTimeout(function () { l.classList.remove('golden'); }, 6000);
        });
        setTimeout(nextParty, 900);
      }, 550);
    }, CELEBRATE_MS);
  }
  // The amount counts up from $0, easing out.
  function countUp(node, to, ms, delay) {
    var label = node.firstChild;
    if (!ms) { label.nodeValue = money.format(to); return; }
    setTimeout(function () {
      var t0 = performance.now();
      (function f(now) { var p = Math.min(1, (now - t0) / ms); label.nodeValue = money.format(Math.round(to * (1 - Math.pow(1 - p, 3))));
        if (p < 1) requestAnimationFrame(f); })(t0);
    }, delay || 0);
  }
  // Gold rush: a storm of spinning coins blasts out from the centre, then coins rain from the top.
  function goldRush(cv, ms) {
    var ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1, W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
    var GOLD = ['#FFCE5C', '#FFE29A', '#F0B44B', '#FFF4CF', '#E8A93A'], P = [], t0 = performance.now(), u = Math.min(W, H);
    for (var i = 0; i < 280; i++) {                         // the blast
      var an = Math.random() * 6.283, sp = (0.5 + Math.random()) * u * 0.032;
      P.push({ x: W / 2, y: H / 2, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, s: (0.009 + Math.random() * 0.007) * u, c: GOLD[i % 5], ph: Math.random() * 6.3, g: 1, at: 0 });
    }
    for (var k = 0; k < 260; k++) {                         // the rain, staggered
      P.push({ x: Math.random() * W, y: -Math.random() * H * 0.9 - 20, vx: 0, vy: u * (0.004 + Math.random() * 0.004), s: (0.008 + Math.random() * 0.006) * u,
               c: GOLD[k % 5], ph: Math.random() * 6.3, g: 0.05, at: 2200 + Math.random() * 1600, sway: Math.random() * 6.3 });
    }
    (function frame(now) {
      var e = now - t0, fade = Math.max(0, Math.min(1, (ms - e) / 900));
      ctx.clearRect(0, 0, W, H);
      P.forEach(function (p) {
        if (e < p.at) return;
        p.vy += u * 0.00055 * p.g; p.vx *= 0.99; p.vy *= 0.993;
        p.x += p.vx + (p.sway != null ? Math.sin(e / 320 + p.sway) * dpr * 1.2 : 0); p.y += p.vy; p.ph += 0.16;
        if (p.y > H + 60) return;
        var flip = Math.abs(Math.cos(p.ph));
        ctx.save(); ctx.globalAlpha = fade; ctx.translate(p.x, p.y);
        ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * Math.max(0.12, flip), 0, 0, 6.283); ctx.fill();
        if (flip > 0.45) { ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(-p.s * 0.3, -p.s * 0.3 * flip, p.s * 0.28, p.s * 0.18 * flip, 0, 0, 6.283); ctx.fill(); }
        ctx.restore();
      });
      if (e < ms) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
    })(t0);
  }
  // Preview on any screen: open the page with #celebrate-test
  if (location.hash === '#celebrate-test') setTimeout(function () {
    partyQueue.push({ ae: 'Blake Fenn', company: 'Test Plumbing & Air', booked: 1500, type: 'New Business' }); nextParty();
  }, 2500);

  var lastBuilt = null, data = null;
  function markStale() {
    if (!data) return;
    var hrs = (Date.now() - new Date(data[0].meta.builtAt).getTime()) / 36e5, sub = $('monthsub');
    sub.classList.toggle('stale', hrs > 3);
    if (hrs > 3 && !/Not updated/.test(sub.textContent)) sub.insertBefore(document.createTextNode('Not updated in ' + Math.floor(hrs) + ' hours: check the Sales KPI sheet. '), sub.firstChild);
  }
  function load() {
    var opt = function (f) { return fetchJson(f).catch(function () { return null; }); };
    Promise.all([fetchJson('summary.json'), fetchJson('monthly.json'), fetchJson('deals.json'), opt('retention.json'), opt('sources.json')]).then(function (r) {
      var built = r[0].meta && r[0].meta.builtAt;
      if (built && built === lastBuilt) { markStale(); return; }
      try {
        render(r[0], r[1], r[2]); renderTicker(r[0].week); fit();
        try { celebrateNew(r[2]); } catch (e3) { console.error(e3); }
        screen2 = false;
        if (r[3] && r[3].retention && r[4] && r[4].sources) {
          try { renderRetention(r[3].retention, r[4].sources); screen2 = true; fitBig(); } catch (e2) { console.error(e2); }
        }
      } catch (err) {
        console.error(err); lastBuilt = null;
        if (data) { var sub = $('monthsub'); sub.classList.add('stale'); sub.textContent = 'The latest update couldn’t be shown (' + err.message + '). Showing the previous numbers; retrying in 2 minutes.'; return; }
        throw err;
      }
      lastBuilt = built; data = r; markStale();
    }).catch(function (e) {
      if (data) { markStale(); return; }
      var st = $('stage'); st.replaceChildren();
      var box = el('div', 'error'); box.appendChild(el('h2', 'wide', 'The numbers didn’t load'));
      box.appendChild(el('p', null, e.message + '. Run the Sales KPI sheet once so the data exists. This screen tries again every 2 minutes.'));
      st.appendChild(box);
    });
  }
  load();
  // Check for a new push every 2 minutes, and right away when the TV wakes or the tab comes back into view.
  setInterval(load, 2 * 60 * 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { load(); tickClock(); } });
  window.addEventListener('focus', function () { load(); tickClock(); });
  // When a new version of this page is published to GitHub, reload once to pick it up
  // (within about 10 minutes). The numbers never need this: they update in place.
  (function selfUpdate() {
    var mine = null;
    function sig(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return s.length + ':' + h; }
    function check() {
      fetch(location.pathname + '?page=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : null; }).then(function (txt) {
        if (!txt || !/<html/i.test(txt)) return;                 // a failed or partial fetch never triggers a reload
        var s = sig(txt);
        if (mine === null) { mine = s; return; }                  // first look: remember this version
        if (s !== mine) location.reload();
      }).catch(function () {});
    }
    check();
    setInterval(check, 10 * 60 * 1000);
  })();
  (function nightly() { var n = new Date(), t = new Date(n); t.setHours(3, 0, 0, 0); if (t <= n) t.setDate(t.getDate() + 1);
    setTimeout(function () { location.reload(); }, t - n); })();
})();
