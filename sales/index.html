<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHIIRP sales</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230F141B%22/><rect x=%227%22 y=%2216%22 width=%224%22 height=%229%22 rx=%221%22 fill=%22%237AA7FF%22/><rect x=%2214%22 y=%2210%22 width=%224%22 height=%2215%22 rx=%221%22 fill=%22%237AA7FF%22/><rect x=%2221%22 y=%226%22 width=%224%22 height=%2219%22 rx=%221%22 fill=%22%23F0A44B%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F141B;
    --raised: #151C26;
    --rule: #232C39;
    --track: #1B2330;
    --text: #E7EAEF;
    --soft: #BAC2CE;
    --muted: #8A94A5;
    --deal: #7AA7FF;
    --exp: #4E6FAE;
    --dlc: #F0A44B;
    --late: #F08A7E;
    --good: #7FD1A3;
    --gold: #FFCE5C;
    --tickh: 0px;
    --u: min(1vw, 1.75vh);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; }
  body { color: var(--text); font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-variation-settings: "wdth" 100;
         font-size: calc(var(--u) * 1.05); line-height: 1.3; font-feature-settings: "tnum" 1, "lnum" 1; }
  .wide { font-variation-settings: "wdth" 116; }
  .narrow { font-variation-settings: "wdth" 82; }
  .hatch { background-image: repeating-linear-gradient(135deg, rgba(15,20,27,.6) 0 3px, transparent 3px 7px); }

  @keyframes drift { 0%{transform:translate(0,0)} 25%{transform:translate(.6%,.5%)} 50%{transform:translate(-.5%,.9%)} 75%{transform:translate(-.6%,-.4%)} 100%{transform:translate(0,0)} }
  @keyframes feed  { from{transform:translateY(0)} to{transform:translateY(-50%)} }
  @keyframes glow  { 0%,100%{opacity:0} 6%,21%{opacity:1} 27%{opacity:0} }

  .stage { position: fixed; top: 0; left: 0; right: 0; bottom: var(--tickh); padding: calc(var(--u) * 2.2) calc(var(--u) * 2.8) calc(var(--u) * 1.8);
           display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: calc(var(--u) * 1.6);
           animation: drift 360s ease-in-out infinite; opacity: 0; pointer-events: none; background: var(--ground); z-index: 1; }
  .stage.on { opacity: 1; pointer-events: auto; }
  /* ---------- screen 3: goal */
  .goal { display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 1.8); padding: 0 calc(var(--u) * 3); min-height: 0; }
  .gtop { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: calc(var(--u) * 3); align-items: end; }
  .gtop .lab { color: var(--muted); font-size: calc(var(--u) * 1.3); margin-bottom: calc(var(--u) * .3); }
  .gtop .v { font-weight: 760; font-size: calc(var(--u) * 5.4); line-height: .95; }
  .gtop .v.dim { color: var(--soft); }
  .gtag { font-weight: 740; font-size: calc(var(--u) * 2.4); padding: calc(var(--u) * .5) calc(var(--u) * 1.4); border-radius: calc(var(--u) * .6); white-space: nowrap; }
  .gtag.bad { background: rgba(240,138,126,.16); color: var(--late); } .gtag.good { background: rgba(127,209,163,.16); color: var(--good); }
  .gbarwrap { padding-top: calc(var(--u) * 2.2); }
  .gbar { position: relative; height: calc(var(--u) * 2.6); border-radius: 99px; background: var(--track); }
  .gbar .fill, .gbar .exp, .gbar .proj { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 99px; }
  .gbar .fill { background: var(--deal); z-index: 3; }
  .gbar .exp { background-color: var(--exp); z-index: 2; }
  .gbar .proj { background: rgba(122,167,255,.18); border: 1px dashed rgba(122,167,255,.6); z-index: 1; }
  .gbar .mark { position: absolute; top: calc(var(--u) * -.8); bottom: calc(var(--u) * -.8); width: 3px; background: var(--text); z-index: 4; }
  .gbar .mark span { position: absolute; top: calc(var(--u) * -2.2); left: 50%; transform: translateX(-50%); white-space: nowrap; color: var(--soft); font-size: calc(var(--u) * 1.05); }
  .gscale { display: flex; justify-content: space-between; color: var(--muted); font-size: calc(var(--u) * 1); margin-top: calc(var(--u) * .6); }
  .gline { font-size: calc(var(--u) * 1.6); color: var(--soft); }
  .gline b { color: var(--text); font-weight: 720; }
  .gline b.bad { color: var(--late); } .gline b.good { color: var(--good); }
  .gline small { display: block; margin-top: calc(var(--u) * .35); color: var(--muted); font-size: .65em; }
  .gnet { border-top: 1px solid var(--rule); padding-top: calc(var(--u) * 1.2); }
  .gnet .h { font-size: calc(var(--u) * 1.5); color: var(--soft); }
  .gnet .h b { font-weight: 740; } .gnet .h b.good { color: var(--good); } .gnet .h b.bad { color: var(--late); }
  .gnet .eq { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 2.4); margin-top: calc(var(--u) * .6); }
  .gnet .term b { display: block; font-weight: 700; font-size: calc(var(--u) * 1.6); color: var(--text); }
  .gnet .term small { color: var(--muted); font-size: calc(var(--u) * .9); }
  .gnet .term.tot b { color: var(--deal); }
  .gnet .h .lapsed { color: var(--muted); font-size: .7em; }
  .gnet .eq { gap: calc(var(--u) * 1.8); }
  .gsrc { border-top: 1px solid var(--rule); padding-top: calc(var(--u) * 1.2); }
  .gsrc .t { display: flex; justify-content: space-between; color: var(--soft); font-weight: 650; font-size: calc(var(--u) * 1.1); margin-bottom: calc(var(--u) * .5); }
  .gsrc .t span { color: var(--muted); font-weight: 500; }
  .gstack { display: flex; height: calc(var(--u) * 1.3); border-radius: calc(var(--u) * .35); overflow: hidden; background: var(--track); }
  .gstack i { display: block; height: 100%; }
  .gleg { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .5) calc(var(--u) * 2); margin-top: calc(var(--u) * .6); font-size: calc(var(--u) * 1); color: var(--soft); }
  .gleg span { display: inline-flex; align-items: center; gap: .45em; }
  .gleg i { width: .8em; height: .8em; border-radius: 2px; display: inline-block; }
  .gleg b { color: var(--text); font-weight: 700; }
  /* Screen change: diagonal slice. The incoming screen sits on top and an angled edge sweeps across
     (a clip-path transition, so the burn-in drift animation is never restarted). */
  .stage.wiping { opacity: 1; z-index: 2; }

  /* ---------- header line */
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 2em; border-bottom: 1px solid var(--rule); padding-bottom: calc(var(--u) * 1); }
  .brand { display: flex; align-items: center; gap: calc(var(--u) * 1.3); min-width: 0; }
  .logo { flex: none; height: calc(var(--u) * 3.5); aspect-ratio: 1078 / 314; margin: calc(var(--u) * .3) calc(var(--u) * -.65) 0 calc(var(--u) * -.58);
          background: url(../chiirp-logo-2026-white.png) left center / contain no-repeat; }   /* the logo file in the repo root (MasterDash/chiirp-logo-2026-white.png) */
  .logo + h1 { padding-left: calc(var(--u) * 1.3); border-left: 1px solid var(--rule); }
  .top h1 { margin: 0; font-weight: 720; font-size: calc(var(--u) * 2.6); line-height: 1; letter-spacing: -.005em; }
  .top h1 span { color: var(--muted); font-weight: 500; }
  .top p { margin: 0; color: var(--muted); font-size: calc(var(--u) * 1); text-align: right; }
  .top p.stale { color: var(--late); }
  .clock { margin-left: 1.6em; color: var(--muted); }
  .clock b { color: var(--text); font-weight: 650; margin-left: .3em; }
  .clock .ago { margin-left: 0; }
  .monthbar { display: inline-block; vertical-align: middle; width: calc(var(--u) * 9); height: 4px; background: var(--track); border-radius: 99px; margin-left: .8em; overflow: hidden; }
  .monthbar i { display: block; height: 100%; background: var(--soft); border-radius: 99px; }

  /* ---------- screen 1 main: hero | race | feed */
  .s1main { display: grid; grid-template-columns: minmax(0, .92fr) minmax(0, 2.05fr) minmax(0, 1.15fr); gap: calc(var(--u) * 2.4); min-height: 0; }

  .hero { display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 1.2); min-height: 0; }
  .hero .lab { color: var(--muted); font-size: calc(var(--u) * 1.05); }
  .hero .big { font-weight: 760; font-size: calc(var(--u) * 5.2); line-height: .95; letter-spacing: -.01em; }
  .hero .exp { color: var(--soft); font-size: calc(var(--u) * 1.4); display: flex; align-items: center; gap: .5em; }
  .hero .exp b { color: var(--text); font-weight: 680; }
  .hero .exp i { width: calc(var(--u) * 1.6); height: calc(var(--u) * .7); border-radius: 99px; background-color: var(--deal); display: inline-block; }
  .facts { display: grid; gap: calc(var(--u) * .9); border-top: 1px solid var(--rule); padding-top: calc(var(--u) * 1.2); }
  .fact { display: flex; align-items: baseline; gap: .6em; }
  .fact b { font-weight: 700; font-size: calc(var(--u) * 2.1); min-width: 2.2em; }
  .fact span { color: var(--muted); font-size: calc(var(--u) * 1.05); }
  .fact span small { font-size: .82em; opacity: .85; }
  .fact.warn b { color: var(--late); }

  .race { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: calc(var(--u) * 1.6); min-height: 0;
          border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); padding: 0 calc(var(--u) * 1.6); }
  .col { position: relative; display: grid; grid-template-rows: auto minmax(calc(var(--u) * 5), .8fr) auto minmax(0, 1.15fr); justify-items: center; min-height: 0; min-width: 0; padding-top: calc(var(--u) * .4); }
  .col::before { content: ""; position: absolute; inset: 0 -12%; border-radius: calc(var(--u) * .8);
                 background: radial-gradient(60% 45% at 50% 60%, rgba(122,167,255,.10), transparent 70%); opacity: 0;
                 animation: glow 44s linear infinite; animation-delay: var(--d, 0s); pointer-events: none; }
  .col .amt { font-weight: 740; font-size: calc(var(--u) * 2.7); line-height: 1; white-space: nowrap; }
  .col .plus { color: var(--soft); font-size: calc(var(--u) * 1); margin-top: calc(var(--u) * .35); white-space: nowrap; }
  .col .plus b { color: var(--text); font-weight: 650; }
  .tube { position: relative; width: min(62%, calc(var(--u) * 6.5)); margin: calc(var(--u) * 1) 0; background: var(--track); border-radius: calc(var(--u) * .6); overflow: hidden; min-height: 0; }
  .tube i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; transition: height 1.4s cubic-bezier(.2,.8,.2,1), bottom 1.4s cubic-bezier(.2,.8,.2,1); }
  .tube i.hatch { opacity: .8; }
  .col .who { text-align: center; align-self: start; width: 100%; min-width: 0; overflow: hidden; }
  .col .who .nm { font-weight: 640; font-size: calc(var(--u) * 1.6); line-height: 1.1; white-space: nowrap; }
  .col .who .rk { color: var(--muted); font-weight: 500; margin-right: .35em; }
  .col .who .dt { color: var(--muted); font-size: calc(var(--u) * .95); margin-top: calc(var(--u) * .3); white-space: nowrap; }
  .col .who .dt.warn { color: var(--late); }
  .dwin { width: 100%; min-height: 0; overflow: hidden; margin-top: calc(var(--u) * .6); border-top: 1px solid var(--rule);
          -webkit-mask-image: linear-gradient(transparent, #000 8%, #000 86%, transparent); mask-image: linear-gradient(transparent, #000 8%, #000 86%, transparent); }
  .dl { list-style: none; margin: 0; padding: 0; }
  .dl.moving { animation: feed var(--feedtime, 40s) linear infinite; }
  .dl li { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: .5em; padding: calc(var(--u) * .45) 0; border-bottom: 1px solid var(--rule); text-align: left; }
  .dl .dco { font-size: calc(var(--u) * .88); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dl .dv { font-size: calc(var(--u) * .88); font-weight: 650; text-align: right; }
  .dl .dwhen { grid-column: 1 / -1; font-size: calc(var(--u) * .75); color: var(--muted); }
  .dl li.due .dco, .dl li.due .dv { color: var(--soft); }
  .dl li.due .dwhen { color: var(--deal); }
  .dl li.none { display: block; color: var(--muted); font-size: calc(var(--u) * .85); border: 0; text-align: center; }
  .list .why.bad { color: var(--late); }
  .col .who .owed { margin-top: calc(var(--u) * .3); color: var(--muted); font-size: calc(var(--u) * .8); line-height: 1.35; opacity: .85; }
  .col .who .owed div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .col .who .owed .more { font-style: italic; }

  .feedcol { background: var(--raised); border-radius: calc(var(--u) * .9); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; overflow: hidden; }
  .feedhead { padding: calc(var(--u) * 1.4) calc(var(--u) * 1.6) calc(var(--u) * .8); display: flex; justify-content: space-between; align-items: baseline; }
  .feedhead h2 { margin: 0; font-weight: 650; font-size: calc(var(--u) * 1.5); }
  .feedhead span { color: var(--muted); font-size: calc(var(--u) * .95); }
  .win { position: relative; overflow: hidden; min-height: 0; -webkit-mask-image: linear-gradient(transparent, #000 6%, #000 88%, transparent); mask-image: linear-gradient(transparent, #000 6%, #000 88%, transparent); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list.moving { animation: feed var(--feedtime, 90s) linear infinite; }
  .list li { display: grid; grid-template-columns: calc(var(--u) * .45) minmax(0, 1fr) auto; gap: calc(var(--u) * .2) calc(var(--u) * 1); padding: calc(var(--u) * .95) calc(var(--u) * 1.6); border-top: 1px solid var(--rule); align-items: center; }
  .list .tick { width: calc(var(--u) * .45); height: calc(var(--u) * 2.1); border-radius: 99px; grid-row: 1 / span 2; }
  .list .co { font-weight: 600; font-size: calc(var(--u) * 1.1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .v { font-weight: 700; font-size: calc(var(--u) * 1.35); text-align: right; white-space: nowrap; }
  .list .why { color: var(--muted); font-size: calc(var(--u) * .92); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .why.warn { color: var(--dlc); }
  .list .side { color: var(--soft); font-size: calc(var(--u) * .92); text-align: right; white-space: nowrap; }
  .empty { color: var(--muted); padding: calc(var(--u) * 1.2) calc(var(--u) * 1.6); }
  .list li.empty { display: block; border-top: 0; }

  /* ---------- screen 1 bottom: six months, one small chart per person */
  .multiples { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: calc(var(--u) * 2.4); border-top: 1px solid var(--rule); padding-top: calc(var(--u) * 1.1); }
  .mult { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto; gap: calc(var(--u) * .3) calc(var(--u) * 1); }
  .mult .nm { font-size: calc(var(--u) * 1.05); color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mult .tot { text-align: right; font-weight: 680; font-size: calc(var(--u) * 1.15); white-space: nowrap; }
  .mult .tot span { color: var(--muted); font-weight: 400; font-size: calc(var(--u) * .9); margin-left: .35em; }
  .mini { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: calc(var(--u) * .5); align-items: end; height: calc(var(--u) * 4.2); }
  .mini i { display: block; border-radius: 3px 3px 1px 1px; background: var(--exp); min-height: 2px; }
  .mini i.now { background: var(--deal); }
  .mini i.dlc { background: #9A6A33; }
  .mini i.dlc.now { background: var(--dlc); }
  .mlabels { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: calc(var(--u) * .5); color: var(--muted); font-size: calc(var(--u) * .85); text-align: center; }
  .mlabels .now { color: var(--text); font-weight: 600; }
  .foot { color: var(--muted); font-size: calc(var(--u) * .85); margin-top: calc(var(--u) * .9); display: flex; justify-content: space-between; gap: 2em; }
  .key { display: flex; gap: 1.4em; white-space: nowrap; }
  .key i { display: inline-block; width: 1.6em; height: .6em; border-radius: 99px; margin-right: .45em; vertical-align: middle; background-color: var(--deal); }

  /* ---------- screen 1, spotlight layout */
  .s1main { grid-template-columns: minmax(0, .9fr) minmax(0, 2.1fr) !important; }
  .left { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: calc(var(--u) * 1.4); min-height: 0; }
  .left .hero { justify-content: flex-start; gap: calc(var(--u) * .6); }
  .left .hero .big { font-size: calc(var(--u) * 4.2); }
  .left .facts { padding-top: calc(var(--u) * .8); }
  .race2 { display: grid; align-content: start; gap: calc(var(--u) * 1.1); border-top: 1px solid var(--rule); padding-top: calc(var(--u) * 1.1); min-height: 0; }
  .lane { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: calc(var(--u) * .3) calc(var(--u) * .8); padding: calc(var(--u) * .45) calc(var(--u) * .7);
          border-radius: calc(var(--u) * .5); border-left: 3px solid transparent; transition: background .5s, border-color .5s; }
  .lane.on { background: var(--raised); border-left-color: var(--deal); }
  .lane .nm { font-weight: 640; font-size: calc(var(--u) * 1.35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lane .nm .rk { color: var(--muted); font-weight: 500; margin-right: .4em; }
  .lane .amt { font-weight: 720; font-size: calc(var(--u) * 1.5); text-align: right; white-space: nowrap; }
  .lane .lbar { grid-column: 1 / -1; position: relative; height: calc(var(--u) * .55); background: var(--track); border-radius: 99px; overflow: hidden; }
  .lane .lbar i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: 99px; transition: width 1.2s cubic-bezier(.2,.8,.2,1), left 1.2s cubic-bezier(.2,.8,.2,1); }
  .lane .sub { grid-column: 1 / -1; color: var(--muted); font-size: calc(var(--u) * .9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lane .sub b { color: var(--soft); font-weight: 600; }
  .spot { position: relative; background: var(--raised); border-radius: calc(var(--u) * .9); padding: calc(var(--u) * 1.5) calc(var(--u) * 1.8) calc(var(--u) * 1.2); min-height: 0; overflow: hidden; }
  .spotin { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: calc(var(--u) * 1.1); height: 100%; transition: opacity .45s ease, transform .45s ease; }
  .spotin.out { opacity: 0; transform: translateY(calc(var(--u) * .6)); }
  .spothead { display: flex; align-items: baseline; justify-content: space-between; gap: 1em; }
  .spothead h2 { margin: 0; font-weight: 740; font-size: calc(var(--u) * 3); line-height: 1; white-space: nowrap; }
  .spothead .stats { color: var(--muted); font-size: calc(var(--u) * 1.1); text-align: right; }
  .spothead .stats b { color: var(--text); font-weight: 700; font-size: calc(var(--u) * 1.8); margin-right: .25em; }
  .spothead .stats .due b { color: var(--soft); font-size: calc(var(--u) * 1.3); }
  .spotcols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(var(--u) * 1.6); min-height: 0; }
  .scol { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; border-top: 1px solid var(--rule); }
  .scol h3 { margin: 0; padding: calc(var(--u) * .7) 0 calc(var(--u) * .3); font-weight: 640; font-size: calc(var(--u) * 1.1); }
  .scol h3 span { color: var(--muted); font-weight: 500; margin-left: .4em; }
  .scol .list li { padding-left: 0; padding-right: 0; grid-template-columns: calc(var(--u) * .4) minmax(0, 1fr) auto; }
  .spotcols { --sz: 1; }
  .spotcols.roomy { --sz: 1.5; } .spotcols.mid { --sz: 1.25; }
  .spotcols.paused .moving { animation-play-state: paused; }
  .scol h3 { font-size: calc(var(--u) * 1.1 * var(--sz)); }
  .scol h3 em { display: block; font-style: normal; color: var(--soft); font-weight: 700; font-size: 1.25em; margin-top: .15em; }
  .scol .list li { padding-top: calc(var(--u) * .95 * var(--sz)); padding-bottom: calc(var(--u) * .95 * var(--sz)); column-gap: calc(var(--u) * .8); }
  .scol .list .tick { width: calc(var(--u) * .45); height: calc(var(--u) * 2.1 * var(--sz)); }

  /* ---------- new sale celebration: "gold rush" (both screens) */

</head>
<body>

<div class="stage on" id="stage">

          <div class="scol"><h3>Due this month <span id="sp-due-n"></span><em id="sp-due-t"></em></h3><div class="win"><ul class="list" id="sp-due"></ul></div></div>

<script>
(function () {
  var money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var C = { deal: 'var(--deal)', exp: 'var(--exp)', dlc: 'var(--dlc)' };
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function nice(n) { return String(n || '').replace(/\b([a-z])/g, function (c) { return c.toUpperCase(); }); }
  function first(n) { return nice(n).split(' ')[0]; }
  function monthOf(mk) { return MONTHS[Number(mk.slice(5, 7)) - 1]; }
  function addMonths(mk, n) { var y = +mk.slice(0, 4), m = +mk.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + (m < 9 ? '0' : '') + (m + 1); }
  function day(d) { return d ? new Date(d + 'T12:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : ''; }
  function plural(k, one, many) { return k + ' ' + (k === 1 ? one : many); }
  function coName(c) { c = String(c || ''); return /^cus_\w+$/.test(c) ? 'Stripe customer \u2026' + c.slice(-8) : (c || 'Account with no name'); }

               c: GOLD[k % 5], ph: Math.random() * 6.3, g: 0.05, at: 2200 + Math.random() * 1600, sway: Math.random() * 6.3 });
    }
    (function frame(now) {
      var e = now - t0, fade = Math.max(0, Math.min(1, (ms - e) / 900));
      ctx.clearRect(0, 0, W, H);
      P.forEach(function (p) {
        if (e < p.at) return;
        p.vy += u * 0.00055 * p.g; p.vx *= 0.99; p.vy *= 0.993;
        p.x += p.vx + (p.sway != null ? Math.sin(e / 320 + p.sway) * dpr * 1.2 : 0); p.y += p.vy; p.ph += 0.16;
        if (p.y > H + 60) return;
        var flip = Math.abs(Math.cos(p.ph));

        ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * Math.max(0.12, flip), 0, 0, 6.283); ctx.fill();
        if (flip > 0.45) { ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(-p.s * 0.3, -p.s * 0.3 * flip, p.s * 0.28, p.s * 0.18 * flip, 0, 0, 6.283); ctx.fill(); }

  }
  // Cash in: green bills burst up from the bottom, flip, and drift down.
  function cashIn(cv, ms) {
    var ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1, W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
    var GREEN = ['#7FD1A3', '#5FBF8A', '#A8E3C1', '#4FA878', '#C9F0D9'], P = [], t0 = performance.now(), u = Math.min(W, H);
    for (var i = 0; i < 220; i++) {                         // the burst from the bottom edge
      var x = Math.random() * W, an = -1.571 + (Math.random() - .5) * 0.9, sp = (0.7 + Math.random() * 0.7) * u * 0.03;
      P.push({ x: x, y: H + 20, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, w: (0.03 + Math.random() * 0.015) * u, c: GREEN[i % 5], ph: Math.random() * 6.3, rot: Math.random() * 6.3, vr: (Math.random() - .5) * 0.08, at: Math.random() * 500 });
    }
    (function frame(now) {
      var e = now - t0, fade = Math.max(0, Math.min(1, (ms - e) / 900));
      ctx.clearRect(0, 0, W, H);
      P.forEach(function (p) {
        if (e < p.at) return;
        p.vy += u * 0.00045; p.vx *= 0.985; p.vy = Math.min(p.vy, u * 0.006);   // rise, then float down slowly like paper
        p.x += p.vx + Math.sin(e / 280 + p.ph) * dpr * (p.vy > 0 ? 1.6 : 0); p.y += p.vy; p.rot += p.vr; p.ph += 0.12;
        if (p.y > H + 80 && p.vy > 0) return;

        ctx.save(); ctx.globalAlpha = fade; ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.max(0.15, Math.abs(flip)));
        ctx.fillStyle = p.c; ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.strokeStyle = 'rgba(15,40,25,.55)'; ctx.lineWidth = Math.max(1, w * 0.05); ctx.strokeRect(-w / 2 + w * 0.1, -h / 2 + h * 0.18, w * 0.8, h * 0.64);
        ctx.fillStyle = 'rgba(15,40,25,.6)'; ctx.beginPath(); ctx.arc(0, 0, h * 0.2, 0, 6.283); ctx.fill();
        ctx.restore();
      });
      if (e < ms) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
    })(t0);
  }
  if (location.hash === '#paid-test') setTimeout(function () {
    partyQueue.push({ kind: 'paid', ae: 'Ky Decker', company: 'Test Heating & Air', booked: 1200, close: '2026-11-09', paid: '2026-11-18' }); nextParty();
  }, 2500);
  // Preview on any screen: open the page with #celebrate-test
  if (location.hash === '#celebrate-test') setTimeout(function () {
    partyQueue.push({ ae: 'Blake Fenn', company: 'Test Plumbing & Air', booked: 1500, type: 'New Business' }); nextParty();
  }, 2500);

  var lastBuilt = null, data = null;
  function markStale() {
    if (!data) return;
    var hrs = (Date.now() - new Date(data[0].meta.builtAt).getTime()) / 36e5, sub = $('monthsub');
    sub.classList.toggle('stale', hrs > 3);
    if (hrs > 3 && !/Not updated/.test(sub.textContent)) sub.insertBefore(document.createTextNode('Not updated in ' + Math.floor(hrs) + ' hours: check the Sales KPI sheet. '), sub.firstChild);
  }
  function load() {
    var opt = function (f) { return fetchJson(f).catch(function () { return null; }); };
    Promise.all([fetchJson('summary.json'), fetchJson('monthly.json'), fetchJson('deals.json'), opt('retention.json'), opt('sources.json')]).then(function (r) {
      var built = r[0].meta && r[0].meta.builtAt;
      if (built && built === lastBuilt) { markStale(); return; }
      try {
        render(r[0], r[1], r[2]); renderTicker(r[2]); fit();
        try { screen3 = renderGoal(r[0], r[4] && r[4].sources, r[3] && r[3].retention); } catch (e4) { console.error(e4); screen3 = false; }
        try { celebrateNew(r[2]); } catch (e3) { console.error(e3); }
        try { celebratePaid(r[2]); } catch (e5) { console.error(e5); }
        screen2 = false;
        if (r[3] && r[3].retention && r[4] && r[4].sources) {
          try { renderRetention(r[3].retention, r[4].sources); screen2 = true; fitBig(); } catch (e2) { console.error(e2); }
        }
      } catch (err) {
        console.error(err); lastBuilt = null;
        if (data) { var sub = $('monthsub'); sub.classList.add('stale'); sub.textContent = 'The latest update couldn’t be shown (' + err.message + '). Showing the previous numbers; retrying in 2 minutes.'; return; }
        throw err;
      }
      lastBuilt = built; data = r; markStale();
    }).catch(function (e) {
      if (data) { markStale(); return; }
      var st = $('stage'); st.replaceChildren();
      var box = el('div', 'error'); box.appendChild(el('h2', 'wide', 'The numbers didn’t load'));
      box.appendChild(el('p', null, e.message + '. Run the Sales KPI sheet once so the data exists. This screen tries again every 2 minutes.'));
      st.appendChild(box);
    });
  }
  load();
  // Check for a new push every 2 minutes, and right away when the TV wakes or the tab comes back into view.
  setInterval(load, 2 * 60 * 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { load(); tickClock(); } });
  window.addEventListener('focus', function () { load(); tickClock(); });
  // When a new version of this page is published to GitHub, reload once to pick it up
  // (within about 10 minutes). The numbers never need this: they update in place.
  (function selfUpdate() {
    var mine = null;
    function sig(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return s.length + ':' + h; }
    function check() {
      fetch(location.pathname + '?page=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : null; }).then(function (txt) {
        if (!txt || !/<html/i.test(txt)) return;                 // a failed or partial fetch never triggers a reload
        var s = sig(txt);
        if (mine === null) { mine = s; return; }                  // first look: remember this version
        if (s !== mine) location.reload();
      }).catch(function () {});
    }
    check();
    setInterval(check, 10 * 60 * 1000);
  })();
  (function nightly() { var n = new Date(), t = new Date(n); t.setHours(3, 0, 0, 0); if (t <= n) t.setDate(t.getDate() + 1);
    setTimeout(function () { location.reload(); }, t - n); })();
})();
