<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHIIRP sales</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230F141B%22/><rect x=%227%22 y=%2216%22 width=%224%22 height=%229%22 rx=%221%22 fill=%22%237AA7FF%22/><rect x=%2214%22 y=%2210%22 width=%224%22 height=%2215%22 rx=%221%22 fill=%22%237AA7FF%22/><rect x=%2221%22 y=%226%22 width=%224%22 height=%2219%22 rx=%221%22 fill=%22%23F0A44B%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F141B;
    --raised: #151C26;
    --rule: #232C39;
    --track: #1B2330;
    --text: #E7EAEF;
    --soft: #BAC2CE;
    --muted: #8A94A5;
    --deal: #7AA7FF;
    --exp: #4E6FAE;
    --dlc: #F0A44B;
    --late: #F08A7E;
    --good: #7FD1A3;
    --tickh: 0px;
    --u: min(1vw, 1.75vh);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; }
  body { color: var(--text); font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-variation-settings: "wdth" 100;
         font-size: calc(var(--u) * 1.05); line-height: 1.3; font-feature-settings: "tnum" 1, "lnum" 1; }
  .wide { font-variation-settings: "wdth" 116; }
  .narrow { font-variation-settings: "wdth" 82; }
  .hatch { background-image: repeating-linear-gradient(135deg, rgba(15,20,27,.6) 0 3px, transparent 3px 7px); }

  @keyframes drift { 0%{transform:translate(0,0)} 25%{transform:translate(.6%,.5%)} 50%{transform:translate(-.5%,.9%)} 75%{transform:translate(-.6%,-.4%)} 100%{transform:translate(0,0)} }
  @keyframes feed  { from{transform:translateY(0)} to{transform:translateY(-50%)} }
  @keyframes glow  { 0%,100%{opacity:0} 6%,21%{opacity:1} 27%{opacity:0} }

  .stage { position: fixed; top: 0; left: 0; right: 0; bottom: var(--tickh); padding: calc(var(--u) * 2.2) calc(var(--u) * 2.8) calc(var(--u) * 1.8);
           display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: calc(var(--u) * 1.6);
           animation: drift 360s ease-in-out infinite; opacity: 0; transition: opacity 1.4s ease; pointer-events: none; }
  .stage.on { opacity: 1; pointer-events: auto; }

  /* ---------- header line */
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 2em; border-bottom: 1px solid var(--rule); padding-bottom: calc(var(--u) * 1); }
  .top h1 { margin: 0; font-weight: 720; font-size: calc(var(--u) * 2.6); line-height: 1; letter-spacing: -.005em; }
  .top h1 span { color: var(--muted); font-weight: 500; }
  .top p { margin: 0; color: var(--muted); font-size: calc(var(--u) * 1); text-align: right; }
  .top p.stale { color: var(--late); }
  .clock { margin-left: 1.6em; color: var(--muted); }
  .clock b { color: var(--text); font-weight: 650; margin-left: .3em; }
  .clock .ago { margin-left: 0; }
  .monthbar { display: inline-block; vertical-align: middle; width: calc(var(--u) * 9); height: 4px; background: var(--track); border-radius: 99px; margin-left: .8em; overflow: hidden; }
  .monthbar i { display: block; height: 100%; background: var(--soft); border-radius: 99px; }

  /* ---------- screen 1 main: hero | race | feed */
  .s1main { display: grid; grid-template-columns: minmax(0, .92fr) minmax(0, 2.05fr) minmax(0, 1.15fr); gap: calc(var(--u) * 2.4); min-height: 0; }

  .hero { display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 1.2); min-height: 0; }
  .hero .lab { color: var(--muted); font-size: calc(var(--u) * 1.05); }
  .hero .big { font-weight: 760; font-size: calc(var(--u) * 5.2); line-height: .95; letter-spacing: -.01em; }
  .hero .exp { color: var(--soft); font-size: calc(var(--u) * 1.4); display: flex; align-items: center; gap: .5em; }
  .hero .exp b { color: var(--text); font-weight: 680; }
  .hero .exp i { width: calc(var(--u) * 1.6); height: calc(var(--u) * .7); border-radius: 99px; background-color: var(--deal); display: inline-block; }
  .facts { display: grid; gap: calc(var(--u) * .9); border-top: 1px solid var(--rule); padding-top: calc(var(--u) * 1.2); }
  .fact { display: flex; align-items: baseline; gap: .6em; }
  .fact b { font-weight: 700; font-size: calc(var(--u) * 2.1); min-width: 2.2em; }
  .fact span { color: var(--muted); font-size: calc(var(--u) * 1.05); }
  .fact.warn b { color: var(--late); }

  .race { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: calc(var(--u) * 1.6); min-height: 0;
          border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); padding: 0 calc(var(--u) * 1.6); }
  .col { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr) calc(var(--u) * 5.4); justify-items: center; min-height: 0; min-width: 0; padding-top: calc(var(--u) * .4); }
  .col::before { content: ""; position: absolute; inset: 0 -12%; border-radius: calc(var(--u) * .8);
                 background: radial-gradient(60% 45% at 50% 60%, rgba(122,167,255,.10), transparent 70%); opacity: 0;
                 animation: glow 44s linear infinite; animation-delay: var(--d, 0s); pointer-events: none; }
  .col .amt { font-weight: 740; font-size: calc(var(--u) * 2.7); line-height: 1; white-space: nowrap; }
  .col .plus { color: var(--soft); font-size: calc(var(--u) * 1); margin-top: calc(var(--u) * .35); white-space: nowrap; }
  .col .plus b { color: var(--text); font-weight: 650; }
  .tube { position: relative; width: min(62%, calc(var(--u) * 6.5)); margin: calc(var(--u) * 1) 0; background: var(--track); border-radius: calc(var(--u) * .6); overflow: hidden; min-height: 0; }
  .tube i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; transition: height 1.4s cubic-bezier(.2,.8,.2,1), bottom 1.4s cubic-bezier(.2,.8,.2,1); }
  .tube i.hatch { opacity: .8; }
  .col .who { text-align: center; align-self: start; max-width: 100%; }
  .col .who .nm { font-weight: 640; font-size: calc(var(--u) * 1.6); line-height: 1.1; white-space: nowrap; }
  .col .who .rk { color: var(--muted); font-weight: 500; margin-right: .35em; }
  .col .who .dt { color: var(--muted); font-size: calc(var(--u) * .95); margin-top: calc(var(--u) * .3); white-space: nowrap; }
  .col .who .dt.warn { color: var(--late); }

  .feedcol { background: var(--raised); border-radius: calc(var(--u) * .9); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; overflow: hidden; }
  .feedhead { padding: calc(var(--u) * 1.4) calc(var(--u) * 1.6) calc(var(--u) * .8); display: flex; justify-content: space-between; align-items: baseline; }
  .feedhead h2 { margin: 0; font-weight: 650; font-size: calc(var(--u) * 1.5); }
  .feedhead span { color: var(--muted); font-size: calc(var(--u) * .95); }
  .win { position: relative; overflow: hidden; min-height: 0; -webkit-mask-image: linear-gradient(transparent, #000 6%, #000 88%, transparent); mask-image: linear-gradient(transparent, #000 6%, #000 88%, transparent); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list.moving { animation: feed var(--feedtime, 90s) linear infinite; }
  .list li { display: grid; grid-template-columns: calc(var(--u) * .45) minmax(0, 1fr) auto; gap: calc(var(--u) * .2) calc(var(--u) * 1); padding: calc(var(--u) * .95) calc(var(--u) * 1.6); border-top: 1px solid var(--rule); align-items: center; }
  .list .tick { width: calc(var(--u) * .45); height: calc(var(--u) * 2.1); border-radius: 99px; grid-row: 1 / span 2; }
  .list .co { font-weight: 600; font-size: calc(var(--u) * 1.1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .v { font-weight: 700; font-size: calc(var(--u) * 1.35); text-align: right; white-space: nowrap; }
  .list .why { color: var(--muted); font-size: calc(var(--u) * .92); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .why.warn { color: var(--dlc); }
  .list .side { color: var(--soft); font-size: calc(var(--u) * .92); text-align: right; white-space: nowrap; }
  .empty { color: var(--muted); padding: calc(var(--u) * 1.2) calc(var(--u) * 1.6); }

  /* ---------- screen 1 bottom: six months, one small chart per person */
  .multiples { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: calc(var(--u) * 2.4); border-top: 1px solid var(--rule); padding-top: calc(var(--u) * 1.1); }
  .mult { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto; gap: calc(var(--u) * .3) calc(var(--u) * 1); }
  .mult .nm { font-size: calc(var(--u) * 1.05); color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mult .tot { text-align: right; font-weight: 680; font-size: calc(var(--u) * 1.15); white-space: nowrap; }
  .mult .tot span { color: var(--muted); font-weight: 400; font-size: calc(var(--u) * .9); margin-left: .35em; }
  .mini { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: calc(var(--u) * .5); align-items: end; height: calc(var(--u) * 4.2); }
  .mini i { display: block; border-radius: 3px 3px 1px 1px; background: var(--exp); min-height: 2px; }
  .mini i.now { background: var(--deal); }
  .mini i.dlc { background: #9A6A33; }
  .mini i.dlc.now { background: var(--dlc); }
  .mlabels { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: calc(var(--u) * .5); color: var(--muted); font-size: calc(var(--u) * .85); text-align: center; }
  .mlabels .now { color: var(--text); font-weight: 600; }
  .foot { color: var(--muted); font-size: calc(var(--u) * .85); margin-top: calc(var(--u) * .9); display: flex; justify-content: space-between; gap: 2em; }
  .key { display: flex; gap: 1.4em; white-space: nowrap; }
  .key i { display: inline-block; width: 1.6em; height: .6em; border-radius: 99px; margin-right: .45em; vertical-align: middle; background-color: var(--deal); }

  /* ---------- screen 2: retention */
  .s2main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.05fr); gap: calc(var(--u) * 2.2); min-height: 0; }
  .kept { display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 1.1); min-height: 0; }
  .kept .big { font-weight: 760; font-size: calc(var(--u) * 5.4); line-height: .95; }
  .kept .lab { color: var(--muted); font-size: calc(var(--u) * 1.05); }
  .scale { position: relative; height: calc(var(--u) * 5.2); margin-top: calc(var(--u) * .4); }
  .scale .track { position: absolute; left: 0; right: 0; top: calc(var(--u) * 2.2); height: calc(var(--u) * .8); background: var(--track); border-radius: 99px; overflow: hidden; }
  .scale .track i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--deal); }
  .scale .track i.proj { background-color: var(--dlc); opacity: .85; }
  .scale .mk { position: absolute; top: 0; transform: translateX(-50%); text-align: center; font-size: calc(var(--u) * .85); color: var(--soft); white-space: nowrap; }
  .scale .mk.low { top: auto; bottom: 0; color: var(--dlc); }
  .scale .ends { position: absolute; bottom: 0; color: var(--muted); font-size: calc(var(--u) * .8); }
  .mrr { display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u) * .5) calc(var(--u) * 1.2); border-top: 1px solid var(--rule); padding-top: calc(var(--u) * 1.1); font-size: calc(var(--u) * 1.05); }
  .mrr span { color: var(--muted); }
  .mrr b { font-weight: 680; text-align: right; }
  .pane { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; border-left: 1px solid var(--rule); padding-left: calc(var(--u) * 2.2); }
  .pane h2 { margin: 0; font-weight: 650; font-size: calc(var(--u) * 1.5); }
  .pane .sum { margin: calc(var(--u) * .3) 0 calc(var(--u) * .7); color: var(--muted); font-size: calc(var(--u) * 1); }
  .pane .sum b { display: block; color: var(--text); font-weight: 740; font-size: calc(var(--u) * 2.6); line-height: 1.05; margin-bottom: calc(var(--u) * .2); }
  .pane .list li { padding-left: 0; padding-right: 0; }
  .tick.lost { background: var(--late); } .tick.sudden { background: var(--dlc); } .tick.soon { background: var(--soft); }
  .srcs { display: grid; gap: calc(var(--u) * .95); align-content: start; min-height: 0; overflow: hidden; }
  .srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: calc(var(--u) * .3) 1em; }
  .srow .nm { font-size: calc(var(--u) * 1.05); }
  .srow .v { font-weight: 700; font-size: calc(var(--u) * 1.25); text-align: right; }
  .srow .tr { grid-column: 1 / -1; height: calc(var(--u) * .4); background: var(--track); border-radius: 99px; overflow: hidden; }
  .srow .tr i { display: block; height: 100%; background: var(--deal); border-radius: 99px; }
  .srow .yr { grid-column: 1 / -1; color: var(--muted); font-size: calc(var(--u) * .88); }
  .s2note { color: var(--muted); font-size: calc(var(--u) * .85); border-top: 1px solid var(--rule); padding-top: calc(var(--u) * .9); }

  /* ---------- 7-day banner (both screens) */
  @keyframes tick { from{transform:translateX(0)} to{transform:translateX(-50%)} }
  .ticker { position: fixed; left: 0; right: 0; bottom: 0; height: var(--tickh); background: var(--raised); border-top: 1px solid var(--rule);
            overflow: hidden; display: none; align-items: center; z-index: 5;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent); mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent); }
  .ticker.on { display: flex; }
  .ticker .track { display: flex; white-space: nowrap; animation: tick var(--ticktime, 120s) linear infinite; }
  .ticker .grp { display: flex; align-items: center; gap: calc(var(--u) * 2.6); padding-right: calc(var(--u) * 2.6); }
  .ticker .hd { font-weight: 680; color: var(--text); background: var(--track); padding: .3em .9em; border-radius: 99px; font-size: calc(var(--u) * .95); }
  .ticker .it { font-size: calc(var(--u) * 1.15); color: var(--muted); }
  .ticker .it b { color: var(--text); font-weight: 680; margin-left: .4em; }
  .ticker .it small { font-size: .82em; margin-left: .35em; }
  .ticker .it .d { font-size: .82em; margin-left: .55em; font-weight: 600; }
  .ticker .when { font-size: .78em; color: var(--muted); margin-left: .45em; padding: .1em .45em; border: 1px solid var(--rule); border-radius: .4em; }
  .ticker .d.good { color: var(--good); } .ticker .d.bad { color: var(--late); } .ticker .d.flat { color: var(--muted); }

  .error { grid-row: 1 / -1; align-self: center; justify-self: center; max-width: 60ch; color: var(--soft); font-size: calc(var(--u) * 1.4); }
  .error h2 { color: var(--text); margin: 0 0 .4em; font-size: calc(var(--u) * 2.4); }
</style>
</head>
<body>

<div class="stage on" id="stage">
  <div class="top">
    <h1 class="wide" id="month">Sales</h1>
    <p id="monthsub">Loading the latest numbers</p>
  </div>
  <div class="s1main" id="main">
    <section class="hero" aria-label="Team this month" id="hero"></section>
    <section class="race" id="reps" aria-label="New revenue collected by person"></section>
    <section class="feedcol" aria-labelledby="feedh">
      <div class="feedhead"><h2 id="feedh">Just collected</h2><span id="feedcount"></span></div>
      <div class="win"><ul class="list" id="feed"></ul></div>
    </section>
  </div>
  <footer id="foot"></footer>
</div>

<div class="stage" id="stage2" aria-hidden="true">
  <div class="top">
    <h1 class="wide" id="r-title">Retention</h1>
    <p id="r-sub"></p>
  </div>
  <div class="s2main">
    <section class="kept" aria-label="MRR kept this month" id="r-kept"></section>
    <section class="pane" aria-labelledby="r-h1"><h2 id="r-h1">Churned this month</h2><p class="sum" id="r-lostsum"></p><div class="win"><ul class="list" id="r-lost"></ul></div></section>
    <section class="pane" aria-labelledby="r-h2"><h2 id="r-h2">Ending this month</h2><p class="sum" id="r-soonsum"></p><div class="win"><ul class="list" id="r-soon"></ul></div></section>
    <section class="pane" aria-labelledby="r-h3"><h2 id="r-h3">New revenue by source</h2><p class="sum" id="r-srcsum"></p><div class="srcs" id="r-src"></div></section>
  </div>
  <div class="s2note narrow" id="r-note"></div>
</div>

<div class="ticker" id="ticker" aria-label="Last 7 days"><div class="track" id="tickTrack"></div></div>

<script>
(function () {
  var money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var C = { deal: 'var(--deal)', exp: 'var(--exp)', dlc: 'var(--dlc)' };
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function nice(n) { return String(n || '').replace(/\b([a-z])/g, function (c) { return c.toUpperCase(); }); }
  function first(n) { return nice(n).split(' ')[0]; }
  function monthOf(mk) { return MONTHS[Number(mk.slice(5, 7)) - 1]; }
  function addMonths(mk, n) { var y = +mk.slice(0, 4), m = +mk.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + (m < 9 ? '0' : '') + (m + 1); }
  function day(d) { return d ? new Date(d + 'T12:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : ''; }
  function plural(k, one, many) { return k + ' ' + (k === 1 ? one : many); }
  function coName(c) { c = String(c || ''); return /^cus_\w+$/.test(c) ? 'Stripe customer \u2026' + c.slice(-8) : (c || 'Account with no name'); }
  function fetchJson(f) {
    return fetch('data/' + f + '?v=' + Date.now(), { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(f + ' could not be loaded (HTTP ' + r.status + ')'); return r.json();
    });
  }
  // Scrolling: 20% faster than the original pace, and a data refresh never restarts a scroll.
  var SPEED = 1.2;
  function loopPos(el) {            // how far through its loop a scroll is (0 to 1), or null
    var a = el.getAnimations && el.getAnimations()[0];
    if (!a || a.currentTime == null) return null;
    var dur = a.effect.getTiming().duration; return dur ? (a.currentTime % dur) / dur : null;
  }
  function resumeAt(el, pos) {      // put a (re)started scroll back where it was
    if (pos == null) return;
    requestAnimationFrame(function () { var a = el.getAnimations && el.getAnimations()[0];
      if (a) a.currentTime = pos * a.effect.getTiming().duration; });
  }
  function fillList(ul, rows, make, empty, secsPerRow) {
    var pos = loopPos(ul);
    ul.replaceChildren(); ul.classList.remove('moving');
    if (!rows.length) { ul.appendChild(el('li', 'empty', empty)); return; }
    var box = ul.parentNode;
    rows.forEach(function (r) { ul.appendChild(make(r)); });
    if (ul.scrollHeight > box.clientHeight + 4) {              // scroll only when it doesn't fit
      rows.forEach(function (r) { ul.appendChild(make(r)); });
      ul.style.setProperty('--feedtime', (Math.max(40, rows.length * (secsPerRow || 8)) / SPEED).toFixed(1) + 's'); ul.classList.add('moving');
      resumeAt(ul, pos);
    }
  }


  // ======================================================= screen 1: sales
  function render(S, M, D) {
    var mk = S.meta.month, now = new Date();
    var dim = new Date(+mk.slice(0, 4), +mk.slice(5, 7), 0).getDate(), today = Math.min(now.getDate(), dim);
    var h = $('month'); h.replaceChildren(document.createTextNode(monthOf(mk) + ' '));
    h.appendChild(el('span', null, 'sales'));
    var sub = $('monthsub'); sub.replaceChildren(document.createTextNode('Day ' + today + ' of ' + dim));
    var mb = el('span', 'monthbar'), mbi = el('i'); mbi.style.width = (100 * today / dim) + '%'; mb.appendChild(mbi); sub.appendChild(mb);
    var clock = el('span', 'clock'); clock.id = 'clock'; sub.appendChild(clock); builtAt = S.meta.builtAt; tickClock();

    // ---- hero
    var t = S.team.thisMonth, tp = S.team.pending || {}, ta = S.team.awaiting || {}, hero = $('hero'); hero.replaceChildren();
    hero.appendChild(el('div', 'lab', 'Collected this month'));
    hero.appendChild(el('div', 'big wide', money.format(t.credited)));
    if (tp.amount) { var ex = el('div', 'exp'); var sw = el('i', 'hatch'); ex.appendChild(sw); ex.appendChild(el('b', null, '+' + money.format(tp.amount)));
                     ex.appendChild(document.createTextNode(' expected')); hero.appendChild(ex); }
    var facts = el('div', 'facts');
    [[t.dealsCollected, t.dealsCollected === 1 ? 'deal paid' : 'deals paid', ''],
     [t.dlcCount || 0, '10DLC increases paid', '']].forEach(function (f) {
      if (f[1].indexOf('10DLC') > -1 && !f[0]) return;
      var d = el('div', 'fact ' + f[2]); d.appendChild(el('b', 'wide', String(f[0]))); d.appendChild(el('span', null, f[1])); facts.appendChild(d);
    });
    hero.appendChild(facts);

    // ---- race: one column per person, solid = collected, hatched = expected
    var reps = S.reps.filter(function (r) { return r.onRoster; })
                     .sort(function (a, b) { return b.thisMonth.credited - a.thisMonth.credited || (a.ae < b.ae ? -1 : 1); });
    var max = Math.max.apply(null, reps.map(function (r) { return r.thisMonth.credited + ((r.pending && r.pending.amount) || 0); }).concat([1]));
    // Recent unpaid wins only (won in the last 30 days, not paid yet). Older ones stay off the screen.
    var cutoff = new Date(now.getTime() - 30 * 86400000), cut = cutoff.getFullYear() + '-' + String(cutoff.getMonth() + 1).padStart(2, '0') + '-' + String(cutoff.getDate()).padStart(2, '0');
    var recent = {};
    D.rows.forEach(function (d) { if (d.status !== 'Collected' && d.status !== 'No Stripe link' && d.close >= cut) recent[d.ae] = (recent[d.ae] || 0) + 1; });
    var race = $('reps'); race.replaceChildren(); race.style.setProperty('--n', reps.length);
    reps.forEach(function (r, i) {
      var x = r.thisMonth, pd = r.pending || {}, isDlc = (x.dlcCredited || 0) + (pd.dlcAmount || 0) > (x.newCredited || 0) + (x.expCredited || 0) + (pd.dealAmount || 0);
      var col = el('div', 'col'); col.style.setProperty('--d', (i * 11) + 's');
      var head = el('div'); head.style.textAlign = 'center';
      head.appendChild(el('div', 'amt wide', money.format(x.credited)));
      var pl = el('div', 'plus'); if (pd.amount) { pl.appendChild(el('b', null, '+' + money.format(pd.amount))); pl.appendChild(document.createTextNode(' expected')); } else pl.textContent = '\u00a0';
      head.appendChild(pl); col.appendChild(head);
      var tube = el('div', 'tube'); tube.setAttribute('role', 'img');
      tube.setAttribute('aria-label', nice(r.ae) + ': ' + money.format(x.credited) + ' collected' + (pd.amount ? ', ' + money.format(pd.amount) + ' expected' : ''));
      var solid = el('i'), hatch = el('i', 'hatch'), color = isDlc ? C.dlc : C.deal;
      solid.style.backgroundColor = color; hatch.style.backgroundColor = color;
      tube.appendChild(solid); tube.appendChild(hatch); col.appendChild(tube);
      var who = el('div', 'who'), nm = el('div', 'nm'); nm.appendChild(el('span', 'rk', String(i + 1))); nm.appendChild(document.createTextNode(first(r.ae)));
      who.appendChild(nm);
      var bits = [];
      if (x.dealsCollected) bits.push(plural(x.dealsCollected, 'deal paid', 'deals paid'));
      if (x.dlcCount) bits.push(plural(x.dlcCount, '10DLC fee', '10DLC fees'));
      if (!bits.length) bits.push('Nothing collected yet');
      who.appendChild(el('div', 'dt', bits.join(', ')));
      if (recent[r.ae]) who.appendChild(el('div', 'dt', recent[r.ae] + ' awaiting payment'));
      col.appendChild(who); race.appendChild(col);
      var hSolid = 100 * x.credited / max, hHatch = 100 * (pd.amount || 0) / max;
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        solid.style.height = hSolid + '%'; hatch.style.bottom = hSolid + '%'; hatch.style.height = hHatch + '%';
      }); });
    });

    // ---- feed
    var items = D.rows.filter(function (d) { return d.status === 'Collected' && d.creditedMonth === mk; })
      .sort(function (a, b) { return a.close < b.close ? 1 : -1; })
      .map(function (d) { return { color: d.type === 'Expansion' ? C.exp : C.deal, co: d.company || 'Unnamed company', v: money.format(d.credited),
                                   why: (d.type === 'Expansion' ? 'Expansion' : 'New business') + ', won ' + day(d.close), who: nice(d.ae) }; });
    var owner = reps.filter(function (r) { return r.thisMonth.dlcCount; })[0];
    if (owner) items.splice(Math.min(1, items.length), 0, { color: C.dlc, co: plural(owner.thisMonth.dlcCount, 'account', 'accounts'),
      v: money.format(owner.thisMonth.dlcCredited), why: '10DLC price increase', who: nice(owner.ae) });
    $('feedcount').textContent = items.length ? plural(items.length, 'line', 'lines') : '';
    fillList($('feed'), items, function (it) {
      var li = el('li'); var tk = el('span', 'tick'); tk.style.background = it.color; li.appendChild(tk);
      li.appendChild(el('span', 'co', it.co)); li.appendChild(el('span', 'v wide', it.v));
      li.appendChild(el('span', 'why', it.why)); li.appendChild(el('span', 'side', it.who)); return li;
    }, 'Nothing collected yet this month.', 9);

    // ---- six months, a small chart per person
    var months = []; for (var k = 5; k >= 0; k--) months.push(addMonths(mk, -k));
    var val = {}; M.rows.forEach(function (m) { val[m.ae + '|' + m.month] = m; });
    var top = 1; reps.forEach(function (r) { months.forEach(function (m) { var v = val[r.ae + '|' + m]; if (v && v.credited - (v.dlcCredited || 0) > top) top = v.credited - (v.dlcCredited || 0); }); });
    var foot = $('foot'); foot.replaceChildren();
    // Six-month charts are for deal revenue: leave out anyone whose credit is all 10DLC.
    var dealReps = reps.filter(function (r) {
      var deals = months.reduce(function (s, m) { var v = val[r.ae + '|' + m]; return s + (v ? v.credited - (v.dlcCredited || 0) : 0); }, 0);
      return deals > 0 || (r.thisMonth.dealsCollected || 0) > 0 || ((r.pending && r.pending.dealAmount) || 0) > 0;
    });
    var grid = el('div', 'multiples'); grid.style.setProperty('--n', dealReps.length);
    dealReps.forEach(function (r) {
      var cell = el('div', 'mult'), sum = 0;
      months.forEach(function (m) { var v = val[r.ae + '|' + m]; sum += v ? v.credited : 0; });
      cell.appendChild(el('div', 'nm', nice(r.ae)));
      var tot = el('div', 'tot wide', money.format(sum)); tot.appendChild(el('span', null, '6 mo')); cell.appendChild(tot);
      var mini = el('div', 'mini'); mini.setAttribute('role', 'img'); mini.setAttribute('aria-label', nice(r.ae) + ', last six months');
      var lab = el('div', 'mlabels');
      months.forEach(function (m) {
        var v = val[r.ae + '|' + m], amt = v ? v.credited : 0, isDlc = v && v.dlcCredited && v.dlcCredited > amt / 2;
        var b = el('i', (m === mk ? 'now ' : '') + (isDlc ? 'dlc' : '')); b.style.height = amt ? Math.max(4, 100 * amt / top) + '%' : '0';
        mini.appendChild(b); lab.appendChild(el('span', m === mk ? 'now' : '', m === mk ? money.format(amt) : monthOf(m).slice(0, 3)));
      });
      cell.appendChild(mini); cell.appendChild(lab); grid.appendChild(cell);
    });
    foot.appendChild(grid);
    var fl = el('div', 'foot narrow');
    fl.appendChild(el('span', null, 'Revenue counts in the month it’s collected: a deal’s first month of MRR when the customer first pays; a 10DLC price increase when its $12 is first paid.'));
    var key = el('span', 'key'); var k1 = el('span'); k1.appendChild(el('i')); k1.appendChild(document.createTextNode('Collected'));
    var k2 = el('span'); k2.appendChild(el('i', 'hatch')); k2.appendChild(document.createTextNode('Expected')); key.appendChild(k1); key.appendChild(k2);
    fl.appendChild(key); foot.appendChild(fl);
  }

  // ======================================================= last refreshed clock (Mountain time: MST, MDT in summer)
  var builtAt = null;
  function tickClock() {
    var c = $('clock'); if (!c || !builtAt) return;
    var d = new Date(builtAt), mins = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
    var at = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Denver', timeZoneName: 'short' });
    var ago = mins < 1 ? 'just now' : mins < 60 ? mins + ' min ago' : Math.floor(mins / 60) + ' h ' + (mins % 60) + ' min ago';
    c.replaceChildren(document.createTextNode('Last refreshed '), el('b', null, at), el('span', 'ago', ', ' + ago));
  }
  setInterval(tickClock, 60000);

  // ======================================================= 7-day banner
  // up = whether a rise is good (true), bad (false); money or count
  function renderTicker(W) {
    var bar = $('ticker'), track = $('tickTrack'), root = document.documentElement;
    if (!W || !W.metrics) { bar.classList.remove('on'); root.style.setProperty('--tickh', '0px'); return; }
    var m = W.metrics, p = W.prev || {}, s = W.sales || null;
    function shift(d, days) { var x = new Date(d + 'T12:00'); x.setDate(x.getDate() + days); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); }
    function short(d) { return new Date(d + 'T12:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
    function range(a, b) { if (!a) return ''; var A = new Date(a + 'T12:00'), B = new Date((b || a) + 'T12:00');
      return short(a) + ' \u2013 ' + (A.getMonth() !== B.getMonth() ? short(b || a) : String(B.getDate())); }
    // label, its time window, value, the comparison value, whether a rise is good, money or count, a note, what the arrow compares against
    function item(label, when, v, prev, up, isMoney, extra, vs) {
      var it = el('span', 'it'); it.appendChild(document.createTextNode(label));
      if (when) it.appendChild(el('span', 'when', when));
      it.appendChild(el('b', 'wide', isMoney ? (v < 0 ? '\u2212' : '') + money.format(Math.abs(v || 0)) : String(v || 0)));
      if (extra) it.appendChild(el('small', null, extra));
      if (prev != null && v != null) {
        var diff = v - prev;
        if (Math.abs(diff) >= 1) {
          var good = up ? diff > 0 : diff < 0;
          it.appendChild(el('span', 'd ' + (good ? 'good' : 'bad'), (diff > 0 ? '\u25B2 ' : '\u25BC ') + (isMoney ? money.format(Math.abs(diff)) : Math.abs(diff)) + ' ' + vs));
        } else it.appendChild(el('span', 'd flat', 'same as ' + vs.replace(/^vs /, '')));
      }
      return it;
    }
    var wk = range(W.start, W.end), asOf = W.end ? 'as of ' + short(W.end) : '', vsWk = 'vs prior week';
    function group() {
      var g = el('div', 'grp');
      g.appendChild(el('span', 'hd', 'Weekly revenue report'));
      g.appendChild(item('New MRR', wk, m.newMrr, p.newMrr, true, true, m.newLogos != null ? plural(m.newLogos, 'logo', 'logos') : '', vsWk));
      g.appendChild(item('Reactivated', wk, m.reactivated, p.reactivated, true, true, '', vsWk));
      g.appendChild(item('Churned', wk, m.churned, p.churned, false, true, m.churnedAccounts != null ? plural(m.churnedAccounts, 'account', 'accounts') : '', vsWk));
      g.appendChild(item('Net change', wk, m.net, p.net, true, true, '', vsWk));
      if (m.active) g.appendChild(item('Active MRR', asOf, m.active, p.active, true, true, '', vsWk));
      if (m.atRisk != null) g.appendChild(item('At risk', asOf, m.atRisk, p.atRisk, false, true, '', vsWk));
      if (m.pending) g.appendChild(item('Pending cancellation', asOf, m.pending, p.pending, false, true, '', vsWk));
      if (m.stale) g.appendChild(item('Stale unpaid', asOf, m.stale, p.stale, false, true, '', vsWk));
      if (s) {
        var sw = range(s.from, s.to), vs7 = 'vs prior 7 days';
        g.appendChild(el('span', 'hd', 'Sales, last 7 days'));
        g.appendChild(item('Deals won', sw, s.now.dealsWon, s.prev.dealsWon, true, false, s.now.bookedMrr ? money.format(s.now.bookedMrr) + ' MRR' : '', vs7));
        if (s.now.dlcPaid || s.prev.dlcPaid) g.appendChild(item('10DLC increases paid', sw, s.now.dlcPaid, s.prev.dlcPaid, true, false, s.now.dlcAmount ? money.format(s.now.dlcAmount) : '', vs7));
      }
      return g;
    }
    root.style.setProperty('--tickh', 'calc(min(1vw, 1.75vh) * 4.2)');
    var pos = loopPos(track);
    bar.classList.add('on'); track.replaceChildren(group(), group());          // two copies make a seamless loop
    requestAnimationFrame(function () {
      var w = track.scrollWidth / 2, u = Math.min(window.innerWidth / 100, window.innerHeight * 0.0175);
      track.style.setProperty('--ticktime', (Math.max(45, w / (u * 3.2)) / SPEED).toFixed(1) + 's');   // about 3.8 units a second
      resumeAt(track, pos);
    });
  }

  // ======================================================= screen 2: retention
  function renderRetention(Rt, So) {
    var mk = Rt.month;
    $('r-sub').textContent = monthOf(mk) + ' so far. Data through ' + day(Rt.dataThrough) + '.';
    var k = $('r-kept'); k.replaceChildren();
    k.appendChild(el('div', 'lab', 'MRR kept this month'));
    k.appendChild(el('div', 'big wide', Rt.retainedSoFar == null ? '—' : (Rt.retainedSoFar * 100).toFixed(1) + '%'));
    // a 90–100% scale: where we are now, and where we land if everything due this month ends
    if (Rt.retainedSoFar != null) {
      var lo = 0.9, pos = function (p) { return Math.max(0, Math.min(100, (p - lo) / (1 - lo) * 100)); };
      var sc = el('div', 'scale'), tr = el('div', 'track');
      var a = el('i'); a.style.width = pos(Rt.retainedSoFar) + '%';
      var b = el('i', 'proj hatch'); b.style.left = pos(Rt.retainedIfAllEnd) + '%'; b.style.width = (pos(Rt.retainedSoFar) - pos(Rt.retainedIfAllEnd)) + '%';
      tr.appendChild(a); tr.appendChild(b); sc.appendChild(tr);
      var m1 = el('div', 'mk', 'now ' + (Rt.retainedSoFar * 100).toFixed(1) + '%'); m1.style.left = pos(Rt.retainedSoFar) + '%'; sc.appendChild(m1);
      if (Rt.retainedIfAllEnd != null) { var m2 = el('div', 'mk low', 'if all end ' + (Rt.retainedIfAllEnd * 100).toFixed(1) + '%'); m2.style.left = pos(Rt.retainedIfAllEnd) + '%'; sc.appendChild(m2); }
      var e1 = el('div', 'ends', '90%'); e1.style.left = '0'; var e2 = el('div', 'ends', '100%'); e2.style.right = '0';
      sc.appendChild(e1); sc.appendChild(e2); k.appendChild(sc);
    }
    var mrr = el('div', 'mrr');
    [['Start of month', Rt.bom], ['MRR now', Rt.current], ['Lost so far', -Rt.churned.mrr], ['Ending this month', -Rt.endingThisMonth.mrr]].forEach(function (x) {
      mrr.appendChild(el('span', null, x[0])); mrr.appendChild(el('b', 'wide', (x[1] < 0 ? '−' : '') + money.format(Math.abs(x[1]))));
    });
    k.appendChild(mrr);

    var ls = $('r-lostsum'); ls.replaceChildren(); ls.appendChild(el('b', 'wide', money.format(Rt.churned.mrr)));
    ls.appendChild(document.createTextNode(plural(Rt.churned.count, 'account', 'accounts') + (Rt.unexpected.count ? ', ' + money.format(Rt.unexpected.mrr) + ' without notice' : '')));
    fillList($('r-lost'), Rt.churned.rows, function (r) {
      var li = el('li'); li.appendChild(el('span', 'tick ' + (r.unexpected ? 'sudden' : 'lost')));
      li.appendChild(el('span', 'co', coName(r.company))); li.appendChild(el('span', 'v wide', money.format(r.mrr)));
      li.appendChild(el('span', 'why' + (r.unexpected ? ' warn' : ''), r.unexpected ? 'Turned off the same day' : 'Asked ' + day(r.requested)));
      li.appendChild(el('span', 'side', 'Ended ' + day(r.ended))); return li;
    }, 'No accounts lost this month.');
    var ss = $('r-soonsum'); ss.replaceChildren(); ss.appendChild(el('b', 'wide', money.format(Rt.endingThisMonth.mrr)));
    ss.appendChild(document.createTextNode(plural(Rt.endingThisMonth.count, 'account', 'accounts') + ' set to end by month end'));
    fillList($('r-soon'), Rt.endingThisMonth.rows, function (r) {
      var li = el('li'); li.appendChild(el('span', 'tick soon'));
      li.appendChild(el('span', 'co', coName(r.company))); li.appendChild(el('span', 'v wide', money.format(r.mrr)));
      li.appendChild(el('span', 'why', 'Asked ' + day(r.requested))); li.appendChild(el('span', 'side', 'Ends ' + day(r.endsAt))); return li;
    }, 'Nothing else set to end this month.');

    var tm = So.thisMonth, yt = So.ytd, sm = $('r-srcsum'); sm.replaceChildren();
    sm.appendChild(el('b', 'wide', money.format(tm.total))); sm.appendChild(document.createTextNode('new revenue this month, ' + money.format(yt.total) + ' this year'));
    var box = $('r-src'); box.replaceChildren();
    var maxM = Math.max.apply(null, tm.mediums.map(function (m) { return m.credited; }).concat([1]));
    tm.mediums.forEach(function (m, i) {
      var y = yt.mediums[i], row = el('div', 'srow');
      row.appendChild(el('span', 'nm', m.medium)); row.appendChild(el('span', 'v wide', money.format(m.credited)));
      var tr = el('div', 'tr'), bar = el('i'); bar.style.width = (100 * m.credited / maxM) + '%'; tr.appendChild(bar); row.appendChild(tr);
      row.appendChild(el('span', 'yr', money.format(y.credited) + ' this year' + (yt.total ? ', ' + Math.round(100 * y.credited / yt.total) + '%' : '')));
      box.appendChild(row);
    });
    $('r-note').textContent = 'MRR kept = (start of month − churned) ÷ start of month. Without notice = asked to cancel and turned off the same day. Ending this month uses each cancellation date in Stripe. Lead source comes from the deal, else its contact, in HubSpot.';
  }

  // ======================================================= fitting text to any screen
  // Columns and amounts must fit their space on any TV shape: shrink the race text a step at a time if not.
  function fit() {
    var race = $('reps'), cols = [].slice.call(document.querySelectorAll('#reps .col'));
    if (!cols.length) return;
    function over() {
      return cols.some(function (c) { var cb = c.getBoundingClientRect();
        return [].some.call(c.querySelectorAll('.amt, .plus, .nm, .dt'), function (e) { var b = e.getBoundingClientRect(); return b.left < cb.left - 1 || b.right > cb.right + 1 || e.scrollWidth > e.clientWidth + 1; }); });
    }
    var s = 1; race.style.removeProperty('--u');
    while (over() && s > 0.6) { s = Math.round((s - 0.04) * 100) / 100; race.style.setProperty('--u', 'calc(min(1vw, 1.75vh) * ' + s + ')'); }
  }
  window.addEventListener('resize', function () { clearTimeout(fit.t); fit.t = setTimeout(fit, 150); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', fit);

  // ======================================================= rotation, refresh, nightly reload
  var screen2 = false, showing = 1;
  setInterval(function () {
    if (!screen2) { if (showing !== 1) { showing = 1; $('stage').classList.add('on'); $('stage2').classList.remove('on'); } return; }
    showing = showing === 1 ? 2 : 1;
    $('stage').classList.toggle('on', showing === 1); $('stage2').classList.toggle('on', showing === 2);
    $('stage').setAttribute('aria-hidden', String(showing !== 1)); $('stage2').setAttribute('aria-hidden', String(showing !== 2));
  }, 40000);

  var lastBuilt = null, data = null;
  function markStale() {
    if (!data) return;
    var hrs = (Date.now() - new Date(data[0].meta.builtAt).getTime()) / 36e5, sub = $('monthsub');
    sub.classList.toggle('stale', hrs > 3);
    if (hrs > 3 && !/Not updated/.test(sub.textContent)) sub.insertBefore(document.createTextNode('Not updated in ' + Math.floor(hrs) + ' hours: check the Sales KPI sheet. '), sub.firstChild);
  }
  function load() {
    var opt = function (f) { return fetchJson(f).catch(function () { return null; }); };
    Promise.all([fetchJson('summary.json'), fetchJson('monthly.json'), fetchJson('deals.json'), opt('retention.json'), opt('sources.json')]).then(function (r) {
      var built = r[0].meta && r[0].meta.builtAt;
      if (built && built === lastBuilt) { markStale(); return; }
      try {
        render(r[0], r[1], r[2]); renderTicker(r[0].week); fit();
        screen2 = false;
        if (r[3] && r[3].retention && r[4] && r[4].sources) {
          try { renderRetention(r[3].retention, r[4].sources); screen2 = true; } catch (e2) { console.error(e2); }
        }
      } catch (err) {
        console.error(err); lastBuilt = null;
        if (data) { var sub = $('monthsub'); sub.classList.add('stale'); sub.textContent = 'The latest update couldn’t be shown (' + err.message + '). Showing the previous numbers; retrying in 2 minutes.'; return; }
        throw err;
      }
      lastBuilt = built; data = r; markStale();
    }).catch(function (e) {
      if (data) { markStale(); return; }
      var st = $('stage'); st.replaceChildren();
      var box = el('div', 'error'); box.appendChild(el('h2', 'wide', 'The numbers didn’t load'));
      box.appendChild(el('p', null, e.message + '. Run the Sales KPI sheet once so the data exists. This screen tries again every 2 minutes.'));
      st.appendChild(box);
    });
  }
  load();
  // Check for a new push every 2 minutes, and right away when the TV wakes or the tab comes back into view.
  setInterval(load, 2 * 60 * 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { load(); tickClock(); } });
  window.addEventListener('focus', function () { load(); tickClock(); });
  // When a new version of this page is published to GitHub, reload once to pick it up
  // (within about 10 minutes). The numbers never need this: they update in place.
  (function selfUpdate() {
    var mine = null;
    function sig(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return s.length + ':' + h; }
    function check() {
      fetch(location.pathname + '?page=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : null; }).then(function (txt) {
        if (!txt || !/<html/i.test(txt)) return;                 // a failed or partial fetch never triggers a reload
        var s = sig(txt);
        if (mine === null) { mine = s; return; }                  // first look: remember this version
        if (s !== mine) location.reload();
      }).catch(function () {});
    }
    check();
    setInterval(check, 10 * 60 * 1000);
  })();
  (function nightly() { var n = new Date(), t = new Date(n); t.setHours(3, 0, 0, 0); if (t <= n) t.setDate(t.getDate() + 1);
    setTimeout(function () { location.reload(); }, t - n); })();
})();
